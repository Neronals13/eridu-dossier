e":"Hollow Zero — Icy Veins","url":"https://icy-veins.com/zenless-zone-zero/hollow-zero"},{"title":"Proxy Network and Inter-Knot — Icy Veins","url":"https://www.icy-veins.com/zenless-zone-zero/proxy-network"},{"title":"Proxy Network — ZZZ Fandom Wiki","url":"https://zenless-zone-zero.fandom.com/wiki/Proxy_Network"},{"title":"What is Zenless Zone Zero — A Little Bit Human","url":"https://www.alittlebithuman.com/what-is-zenless-zone-zero/"},{"title":"Proxies — Pocket Tactics","url":"https://www.pockettactics.com/zenless-zone-zero/proxies"},{"title":"Phaethon faction guide — Icy Veins","url":"https://www.icy-veins.com/zenless-zone-zero/phaethon-faction-guide"},{"title":"ZZZ App Store listing","url":"https://apps.apple.com/us/app/-/id1606356401"},{"title":"Investigation Merits (HIA) — Sportskeeda","url":"https://www.sportskeeda.com/esports/how-obtain-investigation-merits-zenless-zone-zero-zzz"},{"title":"Version 3.0 — Gematsu","url":"https://www.gematsu.com/2026/06/zenless-zone-zero-version-3-0-update-a-sleepwalkers-confession-launches-june-17-alongside-steam-version"},{"title":"Version 3.0 — Anime Corner","url":"https://animecorner.me/zenless-zone-zero-version-3-0-launches-june-17-begins-season-3-with-new-region-roscaelifer/"},{"title":"Version 3.1 — Gematsu","url":"https://gematsu.com/2026/07/zenless-zone-zero-version-3-1-update-the-long-goodbye-launches-july-29"},{"title":"Version 2.8 — Gematsu","url":"https://www.gematsu.com/2026/04/zenless-zone-zero-version-2-8-update-new-eridan-sunset-launches-may-6-steam-version-coming-soon"},{"title":"Story leading into 3.0 — Icy Veins","url":"https://www.icy-veins.com/zenless-zone-zero/news/zenless-zone-zero-introduces-upgraded-agents-and-the-story-leading-into-3-0/"},{"title":"Version 2.0 press release — Game Developer","url":"https://www.gamedeveloper.com/press-release/zenless-zone-zero-version-2-0-ventures-into-waifei-peninsula-and-unveils-exclusive-anniversary-rewards-on-june-6"},{"title":"Version 2.0 Waifei recap — Sportskeeda","url":"https://www.sportskeeda.com/esports/zenless-zone-zero-2-0-waifei-peninsula-story-recap-season-2-episode-1"},{"title":"Season storytelling — ONE Esports","url":"https://www.oneesports.gg/zenless-zone-zero/zenless-zone-zero-storytelling/?nes_article=3"},{"title":"Version 1.7 press release — Game Developer","url":"https://www.gamedeveloper.com/press-release/zenless-zone-zero-version-1-7-spotlights-mockingbird-and-unravels-the-exaltists-conspiracy-on-april-23"},{"title":"Version 1.6 — Gematsu","url":"https://gematsu.com/2025/02/zenless-zone-zero-version-1-6-update-among-the-forgotten-ruins-launches-march-12"},{"title":"Version 1.4 press release — Game Developer","url":"https://www.gamedeveloper.com/press-release/zenless-zone-zero-s-version-1-4-a-storm-of-falling-stars-to-unveil-culminating-chapter-alongside-legendary-void-hunter-on-december-18"},{"title":"Version 1.0 release — ONE Esports","url":"https://www.oneesports.gg/zenless-zone-zero/zenless-zone-zero-10-release-date/"},{"title":"W-Engines — Prydwen","url":"https://www.prydwen.gg/zenless/guides/w-engines"},{"title":"Drive Disk stats — Prydwen","url":"https://www.prydwen.gg/zenless/guides/disk-drives-stats"},{"title":"Bangboo intro — Prydwen","url":"https://www.prydwen.gg/zenless/guides/bangboo-intro"},{"title":"Agents progression — Prydwen","url":"https://www.prydwen.gg/zenless/guides/agents-progression"},{"title":"Combat guide — Mobalytics","url":"https://mobalytics.gg/blog/zenless-zone-zero/zzz-combat-guide/"},{"title":"Drive Disc guide — Mobalytics","url":"https://mobalytics.gg/blog/zenless-zone-zero/drive-disc-guide/"},{"title":"Anomaly buildup and Disorder — Sportskeeda","url":"https://sportskeeda.com/esports/disorders-anomaly-buildup-zenless-zone-zero-explained"},{"title":"Damage types and classes — Sports Illustrated Videogames","url":"https://videogames.si.com/guides/zenless-zone-zero-all-damage-types-classes"},{"title":"Combat explained — Sportskeeda","url":"https://www.sportskeeda.com/esports/zenless-zone-zero-zzz-combat-explained-elements-fighting-styles-daze-mechanism"},{"title":"Assists — Beebom","url":"https://beebom.com/how-use-assists-zenless-zone-zero/amp/"},{"title":"Combat guide — Pocket Gamer","url":"https://www.pocketgamer.com/zenless-zone-zero/combat-guide"},{"title":"Complete combat guide — GamesFuze","url":"https://gamesfuze.com/guides/complete-combat-guide-for-zenless-zone-zero/"},{"title":"Mindscape Cinema — ONE Esports","url":"https://www.oneesports.gg/zenless-zone-zero/mindscape-cinema"},{"title":"Endgame — Icy Veins","url":"https://www.icy-veins.com/zenless-zone-zero/endgame"},{"title":"Drive Discs and W-Engines — HostedGG","url":"https://hostedgg.com/blog/zzz-drive-discs-w-engines-guide"}],"caveats":["Fandom: більшість сторінок (Factions, New Eridu, Lumina Square) повернули помилку; успішно відкрилися лише Locations і Proxy Network. Офіційний сайт і HoYoLAB майже не містять тексту (динамічний контент); дані з HoYoLAB не отримано.","Назва HIA різниться в джерелах: Hollow Investigative Association (Sportskeeda, Вікіпедія) проти Hollow Investigation Association (запит). Точну форму потрібно звірити в грі.","Фраза «приблизно 11 років тому» щодо Катастрофи Порожнин походить з одного підсумку Вікіпедії і не підтверджена повторно.","Список 19 фракцій узято з HostedGG (версія 3.3); у ньому є 'Covenant of Dayat' та 'Defense Force Silver Squad', яких немає в інших джерелах. Game8 згадує 21 фракцію, включно з Phaethon, Roscaelifer і Unknown Realm; Phaethon у список не включено.","Імена деяких Агентів різняться: Nekomata = Nekomiya Mana, Lucy = Luciana de Montefio; склад Spook Shack у старіших джерелах порожній, у HostedGG — п'ятеро.","Prydwen і частина гайдів застарілі: Prydwen згадує атрибут Frost та не згадує Wind, Lumiflux, Auric Ink, Armorer. Нові атрибути й спеціалізації взято з Icy Veins, Game8, Gematsu та інших свіжих статей.","Походження Wind: Pocket Tactics плутає версії 2.8/3.0; Gematsu і Anime Corner підтверджують, що перший Wind-Агент Велина вийшов у 3.0. Ворог з атрибутом Wind з'явився у 2.8.","Lumiflux: Icy Veins частково називає його «Lumen», а аномалія зветься Refringe; версія появи (3.1) виведена із Gematsu.","Децибели: Mobalytics і GamesFuze пишуть про спільну шкалу команди, Prydwen — про окрему в кожного; у файлі прийнято спільну.","Quick Assist, Perfect Assist і Parry: у джерелах немає єдиної термінології; Parry описано як результат Defensive Assist.","Розподіл сюжету за версіями в Сезонах 1–2 (між 1.0 і 1.4, а також усередині 2.x) не підтверджено; Вікіпедія помилково пише, що версія 2.0 вийшла в липні 2025 (за анонсом — 6 червня 2025).","Режими Shiyu Defense (0–3 зірки, 10 етапів) та Deadly Assault описані за Prydwen, а Icy Veins подає новішу структуру (Stable/Critical/Disputed Nodes); деталі могли змінитися.","Згадуваний у запиті «гараж Cunning Hares» не підтверджений джерелами; його не включено.","Українська термінологія неофіційна (перевірки офіційної локалізації не було)."],"agents":[{"id":"anby-demara","name_en":"Anby Demara","name_ua":"Анбі Демара","rarity":"A","element":"Electric","specialty":"Stun","faction_en":"Cunning Hares","faction_ua":"Хитрі Зайці (Cunning Hares)","role_ua":"Оглушувач (Stun), безкоштовний стартовий агент","species_or_background_ua":"Мечниця; у минулому, за даними вікі, була капітаном загону «Silver Squad» (Soldier 0). Вид не підтверджено джерелами","tagline_ua":"Тиха блискавка з мечем","story_ua":"Ніколь підібрала Анбі ще зовсім юною, і відтоді вони тримаються разом. Про своє минуле дівчина говорить вкрай неохоче, тож навколо неї тримається ореол таємниці. Відомо, що колись вона командувала бойовим загоном «Silver Squad» під позивним Soldier 0. Тепер вона працює у «Хитрих Зайцях» і виконує замовлення, пов'язані з Порожнечами.","personality_ua":"Спокійна, зібрана й небагатослівна; у бою дуже вправна, а от у повсякденному житті бракує здорового глузду. Їй буває важко відрізнити реальні події від кіно.","guide":{"playstyle_ua":"Анбі швидко накопичує Daze (шкалу оглушення) базовими атаками, EX-спецатакою та контрударом після ухилення. Її краще тримати на полі недовго: оглушила ворога, а далі змінюй її на основного шкодочина. Найкраще вона працює проти агресивних ворогів, бо контрудар (Dodge Counter) спрацьовує частіше.","strengths_ua":["Проста й зрозуміла атакувальна серія з високим накопиченням оглушення","Власна генерація енергії, яку можна передавати іншим електричним агентам","Безкоштовна: з'являється на старті гри, тож відразу доступна новачкам"],"weaknesses_ua":["Дає команді мало бафів і дебафів, тож її легко замінити сильнішим оглушувачем","Слабка по площі, якщо вороги не зібрані купою"],"best_team_ua":"Гарно працює з Ніколь Демарою (сестри активують додаткові здібності одна одної) та зі шкодочинами, яким потрібне стабільне оглушення, наприклад Харумасою. У складі команди Чжу Юань вона може бути бюджетною заміною Цінъї.","disc_drive_ua":"Основний варіант: 4 предмети King of the Summit + 2 предмети Shockstar Disco або Swing Jazz (для King of the Summit потрібно ~50% Crit Rate). Альтернативи: Astral Voice, Proto Punk. Основні характеристики: слот 4 – Crit Rate, слот 5 – Electric DMG% або ATK%, слот 6 – Impact.","w_engine_ua":"Найкращий у слот: Hellfire Gears (за даними Mobalytics і Prydwen). Безкоштовні/дешеві варіанти: Steam Oven, Precious Fossilized Core. Власний двигун Demara Battery Mark II гайди для неї не рекомендують.","tips_ua":["Виконуй контрудар після ухилення щоразу, коли можеш, навіть якщо це перериває серію","Використовуй захисну допомогу (Defensive Assist), щоб швидше оглушити ворога","Ультімейт краще застосовувати поза вікном оглушення, а не під час нього"],"difficulty":5},"stats_hint":{"atk_style_ua":"Швидкі удари мечем і електричні розряди; накопичення оглушення","stun_ability":4,"anomaly_ability":2,"survivability":2,"estimated":true},"uncertain":["species_or_background_ua (вид персонажа не підтверджено)","story_ua (деталі минулого Silver Squad взято лише з Wikipedia; докладніших сторінок вікі/HoYoLAB відкрити не вдалося)","guide.difficulty (власна оцінка)","stats_hint (власна оцінка)","guide.best_team_ua (повного списку команд на сторінках не було)"]},{"id":"nicole-demara","name_en":"Nicole Demara","name_ua":"Ніколь Демара","rarity":"A","element":"Ether","specialty":"Support","faction_en":"Cunning Hares","faction_ua":"Хитрі Зайці (Cunning Hares)","role_ua":"Саппорт: зниження захисту ворогів і баф команді","species_or_background_ua":"Лідерка агенції «Хитрі Зайці», вуличне минуле. Вид не підтверджено джерелами","tagline_ua":"Хитра, винахідлива, вічно без грошей","story_ua":"Ніколь очолює невелике агентство «Хитрі Зайці», яке береться за різні замовлення, пов'язані з Порожнечами. Багато років вона виживала на вулицях, тому серед знайомих має славу дуже хитрої. Її підхід «все або нічого» не раз призводив до того, що клієнти заносили її до чорного списку. Гроші вона обожнює, але витрачає так, що агенція постійно на межі банкрутства й у боргах.","personality_ua":"Кмітлива й меркантильна, любить ризик і постійно потрапляє в фінансові халепи. Піклується про свою команду, хоч і приховує це за жартами про гроші.","guide":{"playstyle_ua":"Ніколь тримається в тіні основного шкодочина: вмикає EX-спецатаку у ключовий момент, ставить енергетичні поля, які стягують ворогів та знижують захист. Її бафи й дебафи короткі, тож їх треба влучно підганяти під вікно шкоди.","strengths_ua":["Знімає до 40% захисту цілі (на максимальному підвищенні) і підсилює командну шкоду","Енергетичні поля збирають ворогів докупи","Підходить майже будь-якому шкодочину, особливо ефірним та аномальним"],"weaknesses_ua":["Бафи й дебафи тривають дуже мало, потрібен точний таймінг","Погано поєднується з агентами-розривачами (Rupture), чия шкода ігнорує захист"],"best_team_ua":"Класична ефірна команда: Чжу Юань + Анбі Демара (або Цінъї) + Ніколь. Для «Хитрих Зайців»: Біллі Кід як шкодочин, Анбі як оглушувач.","disc_drive_ua":"4 предмети Astral Voice (Mobalytics) або Swing Jazz (Icy Veins); для команд на Disorder – Freedom Blues. 2 предмети Swing Jazz. Слот 4 – Anomaly Proficiency або ATK%, слот 5 – ATK% або Ether DMG%, слот 6 – Energy Regen (найважливіший).","w_engine_ua":"Джерела розходяться: Mobalytics – The Vault, Icy Veins – Weeping Cradle (як найкращий). Дешеві/безкоштовні альтернативи: [Reverb] Mark II або Mark III.","tips_ua":["Вмикай EX-спецатаку в ключовий момент: ефект двигуна The Vault короткий","Тримай кнопку EX-спецатаки й крути джойстик, щоб продовжити заряджання (прийом з Mobalytics)","Мінді (М1) дуже важливий для команд на Disorder, бо подовжує дебаф"],"difficulty":3},"stats_hint":{"atk_style_ua":"Стрільба з ефірних зарядів, енергополя; підсилення команди","stun_ability":1,"anomaly_ability":3,"survivability":2,"estimated":true},"uncertain":["species_or_background_ua (вид не підтверджено)","guide.w_engine_ua (Mobalytics і Icy Veins називають різні найкращі двигуни)","guide.disc_drive_ua (4-предметний сет відрізняється між джерелами)","specialty (Mobalytics і Icy Veins називають її саппортом, а деякі сторінки Prydwen/Icy Veins у профілі показують загальні мітки; прийнято Support)","guide.difficulty (власна оцінка)","stats_hint (власна оцінка)"]},{"id":"billy-kid","name_en":"Billy Kid","name_ua":"Біллі Кід","rarity":"A","element":"Physical","specialty":"Attack","faction_en":"Cunning Hares","faction_ua":"Хитрі Зайці (Cunning Hares)","role_ua":"Дальній фізичний DPS","species_or_background_ua":"Кіборг (інтелектуальний конструкт), колишній учасник «Sons of Calydon»","tagline_ua":"Зоряний лицар із двома револьверами","story_ua":"Біллі колись входив до банди «Sons of Calydon» і, за відомостями, був єдиним, хто зміг перемогти Лайтера. Одну зі своїх механічних рук він віддав Цезарю Кінгу. Нині він працює в «Хитрих Зайцях» і поводиться безтурботно, ніби все це гра. Двох кастомних револьверів він називає своїми «леді».","personality_ua":"Безтурботний і ніби легковажний, затятий фанат серіалу про Зоряних лицарів і любить цитувати його репліки. Коли ситуація стає серйозною, він швидко збирається.","guide":{"playstyle_ua":"Біллі стріляє здалеку, але шкода залежить від відстані: найкраще працює приблизно на трьох клітинках від цілі. Базова схема: Crouching Shot, потім EX-спецатака, зближення і ультімейт. Тримай бафи активними й не нехтуй позиціонуванням.","strengths_ua":["Висока фізична шкода, добре чистить групи ворогів","Безкоштовний і простий: доступний на старті, корисний у ранньому контенті","Здатний показувати хороші результати в ендгеймі при достатніх вкладеннях"],"weaknesses_ua":["Шкода падає з відстанню, потрібно постійно підлаштовувати позицію","Серед DPS-агентів у нижній частині за загальною силою"],"best_team_ua":"Найзручніше в «Хитрих Зайцях»: Біллі як шкодочин, Анбі як оглушувач і Ніколь або інший саппорт. Конкретних команд для Біллі на відкритих сторінках не було, тому це припущення на основі ролей.","disc_drive_ua":"Icy Veins радить 4 предмети Dawn's Bloom; Mobalytics – Woodpecker Electro (або Puffer Electro). Слот 4 – Crit Rate/Crit DMG, слот 5 – Physical DMG% або ATK% (також PEN Ratio), слот 6 – ATK%.","w_engine_ua":"Найкращий: Starlight Engine Replica (його сигнатурний двигун). Безкоштовний/дешевий варіант: Starlight Engine (крафтовий), також Marcato Desire (подієвий).","tips_ua":["Тримайся приблизно на трьох клітинках від цілі: далі шкода падає до 75%, 50%, 25%","Виконуй послідовність: Crouching Shot, EX-спецатака, ривок ближче, ультімейт","Не вкладай все в один параметр: збалансуй Crit Rate, Crit DMG та ATK"],"difficulty":3},"stats_hint":{"atk_style_ua":"Стрільба з двох револьверів, присядь і постріл; шкода залежить від дистанції","stun_ability":1,"anomaly_ability":1,"survivability":2,"estimated":true},"uncertain":["guide.disc_drive_ua (Icy Veins і Mobalytics радять різні сети)","guide.best_team_ua (джерела не наводять команд, це припущення за ролями)","story_ua (відомостей мало: лише з Icy Veins; деякі деталі, як-от що Біллі «єдиний, хто переміг Лайтера», потребують перевірки на вікі)","species_or_background_ua (Wikipedia називає його 'Intelligent Construct', Icy Veins – кіборгом)","guide.difficulty (власна оцінка)","stats_hint (власна оцінка)"]},{"id":"ellen-joe","name_en":"Ellen Joe","name_ua":"Еллен Джо","rarity":"S","element":"Ice","specialty":"Attack","faction_en":"Victoria Housekeeping Co.","faction_ua":"Побутова компанія «Вікторія» (Victoria Housekeeping Co.)","role_ua":"Основний DPS (льодовий)","species_or_background_ua":"Тірен (thiren): акула-мако","tagline_ua":"Сонна покоївка з акулячим хвостом","story_ua":"Еллен належить до персоналу Victoria Housekeeping Co. і за природою є акулою-тірен. Вона надає перевагу спокою й посиденькам з друзями перед додатковою роботою чи клубними активностями. Ззовні вона схожа на милу покоївку, але якщо її розізлити, поводитиметься зовсім не мило. Її відмінні риси – великий акулячий хвіст та величезні ножиці.","personality_ua":"Незворушна, трохи сонна й лінива; віддає перевагу відпочинку. Проте в бою стає вправною та небезпечною.","guide":{"playstyle_ua":"Еллен накопичує заряди Flash Freeze ривками й заряджені атаки у стані Roaming, а потім витрачає їх на посилені базові атаки. Основну шкоду вона завдає у вікні оглушення, поєднуючи ланцюгову атаку, EX-спецатаки, базову атаку 3 та ультімейт.","strengths_ua":["Дуже висока шкода та мобільність: один з найсильніших DPS на релізі","Сильні самобафи, зокрема до 30% Ice DMG від додаткової здібності","Чудово працює у льодовій команді з Лайкаоном та Соукаку"],"weaknesses_ua":["Комбінована гра з кривою навчання","Ланцюгова атака довга й може марнувати вікно оглушення"],"best_team_ua":"Льодова команда: Еллен + Фон Лайкаон (швидкий Daze і зниження опору льоду) + Соукаку (великий баф ATK). Інші варіанти з джерел: Діалін або Астра Яо/Лайтер для сучасних складів.","disc_drive_ua":"Найкращий (Icy Veins): 4 Woodpecker Electro + 2 Polar Metal/Puffer Electro; Pocket Tactics радить 4 Polar Metal + 2 Woodpecker Electro. Слот 4 – Crit Rate або Crit DMG, слот 5 – Ice DMG%, PEN Ratio або ATK%, слот 6 – ATK%.","w_engine_ua":"Найкращий: Deep Sea Visitor (сигнатурний двигун). Сильні альтернативи: The Brimstone, Cannon Rotor (А-ранг), безкоштовний варіант – Starlight Engine.","tips_ua":["Використовуй базові атаки лише тоді, коли є заряди Flash Freeze","Входь у стан Roaming подвійним натисканням або утриманням ухилення, а тоді застосовуй Arctic Ambush","Бережи ультімейт і енергію для вікна оглушення"],"difficulty":2},"stats_hint":{"atk_style_ua":"Швидкий ближній бій із ножицями, холодні ривки, багато комбо","stun_ability":1,"anomaly_ability":3,"survivability":2,"estimated":true},"uncertain":["story_ua (відкрилися лише короткі описи Wikipedia і Pocket Tactics; детальної лору-сторінки вікі/HoYoLAB відкрити не вдалося)","guide.disc_drive_ua (джерела розходяться щодо головного сету)","guide.best_team_ua (команди з Діалін/Астрою Яо взяті з сучасних сторінок; перевір актуальність для 3.3)","guide.difficulty (власна оцінка)","stats_hint (власна оцінка)"]},{"id":"von-lycaon","name_en":"Von Lycaon","name_ua":"Фон Лайкаон","rarity":"S","element":"Ice","specialty":"Stun","faction_en":"Victoria Housekeeping Co.","faction_ua":"Побутова компанія «Вікторія» (Victoria Housekeeping Co.)","role_ua":"Оглушувач із бафами для льодової команди","species_or_background_ua":"Тірен (thiren): білий вовк, старший дворецький, кіберпротези ніг, колишній член «Mockingbird»","tagline_ua":"Вишуканий дворецький із кібернетичними ногами","story_ua":"Лайкаон обіймає посаду головного дворецького Victoria Housekeeping Co. і є білим вовком-тіреном. У минулому він належав до групи «Mockingbird». У бою він покладається на удари кібернетичними ногами. Він бездоганно вихований, але брудну роботу виконує без вагань.","personality_ua":"Відданий і ввічливий, дотримується етикету дворецького. Не терпить бруду, але готовий забруднити руки заради справи.","guide":{"playstyle_ua":"Лайкаон працює як швидкий «заміна-оглушувач»: з'являється через допомогу (Assist), щоб парирувати удар, накопичує Daze і відходить. Відкривай оглушення EX-спецатакою або ультімейтом, щоб спрацював його бонус до шкоди по оглушених.","strengths_ua":["Сильні бафи й дешеві EX-спецатаки, швидке накопичення оглушення","Потребує мало часу на полі й легко підлаштовується під команду","Відносно простий у побудові та працює з багатьма двигунами"],"weaknesses_ua":["Найсильніший у льодових командах","Корисний, лише якщо сам ініціює оглушення"],"best_team_ua":"Льодова команда: Еллен Джо + Лайкаон + Соукаку. Також Prydwen наводить Міябі/Лайкаон/Соукаку.","disc_drive_ua":"Стандартні: 4 предмети оглушувального сету King of the Summit (потрібен ~50% Crit Rate) або Astral Voice. 2 предмети: Shockstar Disco, Swing Jazz. Слот 4 – Crit Rate, слот 5 – Ice DMG%, слот 6 – Impact.","w_engine_ua":"Prydwen: найкращий Blazing Laurel; хороші альтернативи Precious Fossilized Core і Steam Oven (доступніші). Його сигнатурний двигун The Restrained за Prydwen йому слабо підходить, а Mobalytics його радить, тож тут джерела розходяться.","tips_ua":["Тримай Лайкаона переважно поза полем і виходь парирувати через Assist","Відкривай оглушення EX-спецатакою або ультімейтом","Не заряджай EX-спецатаку повністю, а розбивай використання, щоб підтримувати King of the Summit"],"difficulty":4},"stats_hint":{"atk_style_ua":"Швидкі удари ногами, парирування й льодові баф-атаки","stun_ability":5,"anomaly_ability":2,"survivability":3,"estimated":true},"uncertain":["guide.w_engine_ua (Prydwen проти Mobalytics щодо The Restrained)","guide.best_team_ua (команди залежать від версії; Prydwen і Mobalytics наводять різні)","story_ua (опис походить з короткого запису Wikipedia; докладніших лор-сторінок відкрити не вдалося)","guide.difficulty (власна оцінка)","stats_hint (власна оцінка)"]},{"id":"koleda-belobog","name_en":"Koleda Belobog","name_ua":"Коледа Белобог","rarity":"S","element":"Fire","specialty":"Stun","faction_en":"Belobog Heavy Industries","faction_ua":"Важка промисловість «Белобог» (Belobog Heavy Industries)","role_ua":"Оглушувач з вогняною шкодою","species_or_background_ua":"Людина (за описом, невисока дівчина); очільниця компанії. Вид офіційно не підтверджено","tagline_ua":"Президентка з вогняним молотом","story_ua":"Коледа очолює Belobog Heavy Industries, компанію, що досліджує Порожнечі та бере участь у будівництві Нового Еріду. Колишній президент Хорс Белобог, її батько, зник після скандалу зі зловживаннями. Коледа його глибоко ненавидить і пообіцяла сама дбати про компанію. Вона надає перевагу польовій роботі й особисто веде бій.","personality_ua":"Запальна, сувора й рішуча; дрібна на зріст, але не уникає сутичок.","guide":{"playstyle_ua":"Коледа б'є молотом: ланцюжок базових атак і контрударів, після 2-го або 4-го удару використовуй Special/EX-спецатаку. EX-спецатака дає «Furnace Fire» (Вогонь горна), що живить посилені базові атаки. Найкраще вона працює в парі з Беном.","strengths_ua":["Потужне накопичення оглушення","Сильна синергія з Беном через спільні атаки (Coordinated Attacks)","Може також виступати джерелом шкоди у командах з Беном"],"weaknesses_ua":["Самостійно слабша: розкривається в парі з Беном","Додаткова здібність потребує союзника тієї ж стихії або фракції"],"best_team_ua":"Бен (спільні атаки) + Солдат 11 як основний DPS у вогняній команді; безкоштовний варіант: Антон + Коледа + Ніколь.","disc_drive_ua":"Для оглушення: Shockstar Disco (2+4); для шкоди: Inferno Metal; також Woodpecker Electro. Слот 4 – Crit Rate або Crit DMG, слот 5 – PEN Ratio або Fire DMG%, слот 6 – Impact (для оглушення) або Energy Regen.","w_engine_ua":"Найкращий: Hellfire Gears (сигнатурний двигун). Бюджетні A-ранг: Six Shooter або Steam Oven.","tips_ua":["Застосовуй Special/EX-спецатаку невдовзі після 2-го або 4-го удару базової серії","Прокачуй Core Passive насамперед, бо вона покращує й додаткову здібність, і допомоги","Парируй захисною допомогою (Perfect Assist), щоб менше витрачати очок допомоги"],"difficulty":3},"stats_hint":{"atk_style_ua":"Важкі удари молотом і вогняні вибухи","stun_ability":4,"anomaly_ability":2,"survivability":3,"estimated":true},"uncertain":["species_or_background_ua (вид не підтверджено)","rarity (Mobalytics називає S-ранг; сторінка Prydwen натякає на A-ранг через автоматично згенерований текст, тож прийнято S за Mobalytics)","guide.best_team_ua (команди з Mobalytics, можуть бути застарілими для 3.3)","story_ua (лор з Sportskeeda та Wikipedia; докладної лор-сторінки вікі відкрити не вдалося)","guide.difficulty (власна оцінка)","stats_hint (власна оцінка)"]},{"id":"ben-bigger","name_en":"Ben Bigger","name_ua":"Бен Біґґер","rarity":"A","element":"Fire","specialty":"Defense","faction_en":"Belobog Heavy Industries","faction_ua":"Важка промисловість «Белобог» (Belobog Heavy Industries)","role_ua":"Захисний саппорт: щит для команди","species_or_background_ua":"Тірен (thiren): гризлі, бухгалтер компанії","tagline_ua":"Ведмідь-бухгалтер зі щитом на всю команду","story_ua":"Бен пішов працювати в Belobog Heavy Industries як механічний оператор на передовій. Пізніше Коледа підвищила його до фінансового радника, і сьогодні він працює бухгалтером. Попри грізну зовнішність гризлі, поза боєм він рідко виходить із себе.","personality_ua":"Працьовитий і врівноважений: масивний, але не агресивний, злиться лише в бою.","guide":{"playstyle_ua":"Бен — повільний фронтовик: блокує атаки Special-атакою (отримуючи щит і можливість контратаки), а EX-спецатакою накладає великий щит на всю команду. Ланцюгові атаки використовуй безпосередньо перед вікном основної шкоди. З Коледою його ультімейт і посилені базові атаки працюють значно краще.","strengths_ua":["Дає всьому загону значний щит під час EX-комбо","Збільшує Crit Rate вогняних союзників і союзників з Belobog (16%), поки вони під щитом","Розкривається в парі з Коледою"],"weaknesses_ua":["Дуже повільне пересування","Менше Impact, ніж у профільних оглушувачів, і мало команд, які повністю використовують його"],"best_team_ua":"Коледа Белобог (синергія спільних атак), Солдат 11 як шкодочин, Люсі як саппорт для бафів.","disc_drive_ua":"Джерела розходяться: Prydwen – сет підтримки (Energy Regen 2 + 15% шкоди загону 4) у парі з Soul Rock, Icy Veins – Shockstar Disco або Proto Punk 4 + Swing Jazz/King of the Summit 2. Слоти 4/5/6: переважно DEF% (слот 6 – DEF%, Energy Regen або Impact%).","w_engine_ua":"Icy Veins: найкращий Spring Embrace; сигнатурний Big Cylinder (A-ранг) зменшує шкоду і дає критичний контрудар від захисту. PCGamesN також називає Big Cylinder найкращим. Окремого дешевого варіанту джерела не вказують.","tips_ua":["Блокуй Special-атакою, щоб отримати щит і контрудар","Використовуй ланцюгову атаку безпосередньо перед головним вікном шкоди","Поєднуй його з вогняними агентами або агентами Belobog для бонусу Crit Rate"],"difficulty":3},"stats_hint":{"atk_style_ua":"Блоки, щити, потужні контрудари","stun_ability":2,"anomaly_ability":1,"survivability":5,"estimated":true},"uncertain":["guide.disc_drive_ua (Prydwen і Icy Veins радять різні сети)","guide.w_engine_ua (немає дешевого варіанту в джерелах; Big Cylinder як сигнатурний, але його доступність не перевірена)","story_ua (лор з Wikipedia та Sportskeeda: два джерела описують його то як бухгалтера, то як фінансового радника)","guide.difficulty (власна оцінка)","stats_hint (власна оцінка)"]},{"id":"zhu-yuan","name_en":"Zhu Yuan","name_ua":"Чжу Юань","rarity":"S","element":"Ether","specialty":"Attack","faction_en":"Criminal Investigation Special Response Team (New Eridu Public Security)","faction_ua":"Спецгрупа реагування кримінального розшуку (Громадська безпека Нового Еріду)","role_ua":"Основний DPS (ефір, постріли)","species_or_background_ua":"Лідерка загону Громадської безпеки Нового Еріду. Вид офіційно не підтверджено","tagline_ua":"Лідерка спецгрупи з ефірним пістолетом","story_ua":"Чжу Юань очолює Criminal Investigation Special Response Team у структурі Громадської безпеки Нового Еріду. Вона воює пістолетом, що стріляє ефірними зарядами, поєднуючи постріли з прийомами бойових мистецтв. Вона особливо ефективна проти ефіріалів. Докладнішу передісторію відкриті джерела не розкривають.","personality_ua":"Характер у відкритих джерелах не описаний; на основі посади – відповідальна лідерка команди (припущення).","guide":{"playstyle_ua":"Чжу Юань має два режими: Assault Mode (звичайні комбо) і Suppressive Mode (утримання атаки, щоб випустити накопичені посилені патрони). Патрони накопичуються від EX-спецатаки, ультімейту, ланцюгової атаки та бічних ривків. Найбільша шкода – у вікні оглушення.","strengths_ua":["Рухи ривка збільшують шкоду та на мить дають невразливість у комбо","Добрі хітбокси для проходу по групах ворогів, хоч вона переважно дальня","Сильна у вікні оглушення, особливо в ефірній команді"],"weaknesses_ua":["Шкода різко падає без посилених патронів","Сильно залежить від оглушувача в команді"],"best_team_ua":"Ефірна команда: Чжу Юань + Ніколь + Анбі Демара або Цінъї. Також Астра Яо як сильний саппорт.","disc_drive_ua":"Ether DMG сет Chaotic Metal 4 + Woodpecker Electro 2 (Prydwen). Альтернатива: 4 Woodpecker Electro + 2 Chaotic Metal. Слот 4 – Crit DMG або Crit Rate, слот 5 – Ether DMG%, слот 6 – ATK% (старіші гайди радили Energy Regen).","w_engine_ua":"Найкращий: Riot Suppressor Mark VI (сигнатурний). Хороші альтернативи: The Brimstone, безкоштовний/дешевий варіант – Starlight Engine; також Street Superstar.","tips_ua":["Створюй патрони бічними ривками базових атак і не витрачай їх одразу","Заходь у Suppressive Mode приблизно при 5–9 патронах","Перед вибухом залиши ~2 патрони, потім ланцюгова атака, швидка допомога, EX-спецатака"],"difficulty":3},"stats_hint":{"atk_style_ua":"Постріли ефірними патронами та бойові мистецтва; режими Assault і Suppressive","stun_ability":1,"anomaly_ability":2,"survivability":2,"estimated":true},"uncertain":["personality_ua (характер у відкритих джерелах не описаний)","species_or_background_ua (вид не підтверджено)","faction_en (Prydwen пише N.E.P.S., інші джерела – Criminal Investigation Special Response Team у складі Громадської безпеки)","story_ua (джерела майже не містять лору)","guide.best_team_ua (Icy Veins і Pocket Tactics дають різні варіанти)","guide.disc_drive_ua (джерела розходяться щодо слоту 6)","guide.difficulty (власна оцінка)","stats_hint (власна оцінка)"]},{"id":"qingyi","name_en":"Qingyi","name_ua":"Цінъї","rarity":"S","element":"Electric","specialty":"Stun","faction_en":"Criminal Investigation Special Response Team (N.E.P.S.)","faction_ua":"Спеціальна група реагування кримінального розслідування (N.E.P.S.)","role_ua":"Оглушувач (Stun) для команди","species_or_background_ua":"Гінойд (андроїд) 01 Neo-Genesis VI, молода офіцерка поліційного підрозділу Нового Еріду","tagline_ua":"Юна на вигляд, стара душею","story_ua":"Цінъї служить у спецпідрозділі кримінальних розслідувань Нового Еріду й виглядає як зовсім юна новачка в формі. Насправді вона штучна істота — гінойд серії Neo-Genesis, а тому поводиться значно зрілішою, ніж здається на перший погляд. Офіційна подача персонажа обіграє саме цей контраст між свіжим обличчям і «старою душею». Бойовий стиль Цінъї побудований на швидких електричних ударах, що виводять ворога з рівноваги.","personality_ua":"Спокійна й зібрана, з мудрістю, що не пасує до її юного вигляду. У бою — точна і впевнена.","guide":{"playstyle_ua":"Цінъї накопичує ресурс Flash Connect Voltage електричними атаками, а потім входить у стан Flash Connect, де накладає стаки «Підкорення» (Subjugation), що підвищують шкоду по оглушеному ворогу. Вона тримається на полі довго, підтримуючи ланцюжок базових атак і ухиляючись, щоб не втратити комбо.","strengths_ua":["Швидко накопичує оглушення (Daze)","Дає великий приріст шкоди команді під час вікна оглушення","Має вікна невразливості та захисту від переривання в комбо"],"weaknesses_ua":["Потребує багато часу на полі поза вікном оглушення","Довгі комбо можуть здаватися незграбними й потребують практики"],"best_team_ua":"Добре працює з Харумасою (Harumasa) чи Чжу Юань (Zhu Yuan) як основним DPS, а з Астрою Яо (Astra Yao) або Ріною (Rina) як підтримкою: вони підсилюють шкоду у вікно оглушення, яке створює Цінъї.","disc_drive_ua":"Найкраще: 4 предмети King of the Summit + 2 предмети Shockstar Disco. Слот 4: Crit Rate (далі Crit DMG), слот 5: Electric DMG%, слот 6: Impact.","w_engine_ua":"Найкращий: Ice-Jade Teapot (сигнатурний). Безкоштовні/дешеві (крафт): Steam Oven та Precious Fossilized Core. Також добра альтернатива — The Restrained.","tips_ua":["Під час EX-спеціальних атак стійте впритул до ворога: далекі удари можуть промахнутись і дати менше оглушення та Voltage.","Уникайте перших двох ударів базової атаки (P1, P2): вони майже не дають Voltage.","Не відкладайте «Підкорення» заради малого приросту оглушення: атака з 75 Voltage майже така ж сильна, як зі 100."],"difficulty":3},"stats_hint":{"atk_style_ua":"Ближній бій, електричні комбо з накопиченням Voltage","stun_ability":5,"anomaly_ability":2,"survivability":3,"estimated":true},"uncertain":["faction_ua: офіційний український переклад назви фракції невідомий; Prydwen вказує N.E.P.S., Wikipedia/Icy Veins — Criminal Investigation Special Response Team (C.I.S.R.T.)","story_ua: детальної офіційної передісторії на перевірених сайтах не знайдено; використано лише підтверджені факти (гінойд, підрозділ, подача персонажа)","best_team_ua: Ріна і Харумаса — з рейтингів Prydwen; точні ранги змінюються з патчами","tagline та personality_ua частково виведені з офіційної назви демо «Youthful Appearance, Old Soul» (не з прямого опису характеру)"]},{"id":"soukaku","name_en":"Soukaku","name_ua":"Соукаку","rarity":"A","element":"Ice","specialty":"Support","faction_en":"Hollow Special Operations Section 6","faction_ua":"Спеціальний відділ Hollow, Секція 6 (Section 6)","role_ua":"Баффер для льодових DPS","species_or_background_ua":"Блакитна оні (blue oni), прийомна сестра Цукісіро Янагі","tagline_ua":"Ненажерлива оні з серцем воїна","story_ua":"Соукаку — блакитна оні, яка служить у Секції 6, спецвідділі з порятунку й дослідження Hollow. Вона поводиться по-дитячому: понад усе любить розмови про їжу, не терпить марнування, а слова інколи вимовляє або пише з помилками. Офіційний титул «Ненажера» (Glutton) влучно передає її вдачу — вона найщасливіша, коли сита. Попри безтурботність, у бою вона виявляється напрочуд сильною.","personality_ua":"Простодушна, по-дитячому щира й завжди голодна. Не любить марнотратства.","guide":{"playstyle_ua":"Соукаку накопичує до 3 стаків Vortex через EX-спеціальні атаки чи ультимейт. Затиснувши спеціальну атаку, вона запускає Fly the Flag, що витрачає Vortex. Після цього швидка підтримка (Quick Assist) передає бафи основному DPS.","strengths_ua":["Дуже великий плоский бонус до ATK з майже постійним ефектом","Дає всій команді +20% до шкоди льодом","Безкоштовна — її можна отримати без донату"],"weaknesses_ua":["Баф ATK діє лише на одного агента, тому слабо підходить для другого DPS","Повільні анімації основних здібностей ускладнюють ротації"],"best_team_ua":"Найкраще поєднується з Міябі (Hoshimi Miyabi) або Еллен Джо (Ellen Joe) як льодовими DPS, а також з Юдзухою (Ukinami Yuzuha), бо льодові дамагдилери максимально використовують її баф.","disc_drive_ua":"Найкраще: 4 предмети Astral Voice (альтернатива Freedom Blues/Moonlight Lullaby) + 2 предмети Swing Jazz або Phaethon's Melody. Слот 4: ATK%, слот 5: ATK% (або Ice DMG%), слот 6: Energy Regen або ATK%.","w_engine_ua":"Найкращий: Bashful Demon (сигнатурний). Безкоштовні/дешеві альтернативи: Slice of Time (4★) та [Reverb] Mark II; сильна, але недешева — Weeping Cradle.","tips_ua":["Набирайте Vortex через EX-спеціальні атаки, потім запускайте Fly the Flag і одразу передайте естафету основному DPS через швидку допомогу.","Прокачуйте ATK%: плоский баф у 1000 ATK досягає максимуму лише за достатньої сили Соукаку.","Її посилені базові та ланцюгові атаки повільні — не витрачайте на них ресурси, зосередьтесь на баффах."],"difficulty":2},"stats_hint":{"atk_style_ua":"Ближній бій, льодова підтримка з баффами","stun_ability":2,"anomaly_ability":3,"survivability":2,"estimated":true},"uncertain":["species_or_background_ua та зв'язок із Янагі: лише Wikipedia, на Prydwen/Icy Veins не підтверджено","faction_ua: офіційний український переклад назви відсутній; використано власний переклад","story_ua: офіційної довгої передісторії на перевірених сайтах немає; використано лише профіль і нікнейм","точні ефекти Astral Voice vs Freedom Blues для неї різняться між джерелами (Prydwen каже Freedom Blues/Moonlight Lullaby, Icy Veins — Astral Voice/Proto Punk)"]},{"id":"hoshimi-miyabi","name_en":"Hoshimi Miyabi","name_ua":"Хосімі Міябі","rarity":"S","element":"Frost","specialty":"Anomaly","faction_en":"Hollow Special Operations Section 6","faction_ua":"Спеціальний відділ Hollow, Секція 6 (Section 6)","role_ua":"Основний DPS (Frost Anomaly)","species_or_background_ua":"Чорна лисиця-тірен (black fox Thiren), спадкоємиця відомого роду майстрів бойових мистецтв","tagline_ua":"Крижаний клинок спадкоємиці Хосімі","story_ua":"Хосімі Міябі очолює Секцію 6 — спецвідділ, що працює з небезпечними зонами Hollow. Вона походить із відомої в Новому Еріду родини майстрів бойових мистецтв і несе її спадковий клинок. Її мета — захищати місто, а ще вона мріє зібрати велику колекцію мечів. Бойова манера Міябі вишукана та сповнена гідності, як і личить спадкоємиці давнього роду.","personality_ua":"Статечна, зібрана, відповідальна за місто. У вільний час захоплюється колекціонуванням мечів.","guide":{"playstyle_ua":"Основну шкоду Міябі завдає повністю зарядженою базовою атакою Shimotsuki, яка витрачає до 6 орбів «Fallen Frost». Орби вона отримує від EX-спеціальних атак, ультимейту та Disorder, які запускають союзники. Тому вона чергує накладання Frost Anomaly та швидку заміну героя, щоб партнер запустив Disorder.","strengths_ua":["Дуже високі множники шкоди та вибуховий урон","Широкі зони ураження на багатьох атаках","Багато варіантів команд, зокрема доступних без донату"],"weaknesses_ua":["Мало хороших W-Engine, окрім сигнатурного","Потребує точного таймінгу накладання Frost і високого Crit Rate (близько 80%)"],"best_team_ua":"Найкращі партнери — Астра Яо (Astra Yao) або Юдзуха (Ukinami Yuzuha) як підтримка та Янагі (Tsukishiro Yanagi) або Вівіан (Vivian) як другий Anomaly-герой: вони запускають Disorder і наповнюють її орбами.","disc_drive_ua":"Найкраще: 4 предмети Branch & Blade Song + 2 предмети Woodpecker Electro (або Polar Metal). Слот 4: Crit Rate (або Crit DMG), слот 5: Ice DMG% / PEN Ratio / ATK%, слот 6: ATK%.","w_engine_ua":"Найкращий: Hailstorm Shrine (сигнатурний) — далеко попереду решти. Дешевші альтернативи: Fusion Compiler або Electro-Lip Gloss.","tips_ua":["На відкритті бою: EX-спеціальна Hisetsu, потім удари Kazahana 3–5 для Frost Anomaly і повністю заряджений Shimotsuki з 6 орбами.","Ультимейт використовуйте у вікно оглушення ворога.","Після заряду Shimotsuki швидко міняйте героя: анімація завершиться навіть після заміни."],"difficulty":4},"stats_hint":{"atk_style_ua":"Ближній бій катаною, заряджені удари льодом","stun_ability":2,"anomaly_ability":5,"survivability":2,"estimated":true},"uncertain":["Fusion Compiler/Electro-Lip Gloss як «дешеві» W-Engine: Icy Veins не позначає жоден двигун безкоштовним (лише що вони в межах 10–20% один від одного); Electro-Lip Gloss — з боєвого пропуску за іншими даними","Розрізнення Frost/Ice: джерела пишуть «Ice (Frost)», у грі Міябі має атрибут Frost","species (чорна лисиця-тірен) і назва меча «Tailless» — лише Wikipedia","story_ua: Prydwen/Icy Veins дають лише одне речення передісторії"]},{"id":"burnice-white","name_en":"Burnice White","name_ua":"Бернис Вайт","rarity":"S","element":"Fire","specialty":"Anomaly","faction_en":"Sons of Calydon","faction_ua":"«Сини Каледона» (Sons of Calydon)","role_ua":"Допоміжний DPS (Fire Anomaly поза полем)","species_or_background_ua":"Барменка та «паливна ентузіастка» байкерської банди Sons of Calydon","tagline_ua":"Вогняний бармен із нітро-паливом","story_ua":"Бернис — учасниця байкерської банди Sons of Calydon з Зовнішнього кільця міста. Вона відповідає за паливо для техніки банди й подає друзям власний коктейль на основі нітро-палива. Про пальне вона говорить із такою пристрастю, що все інше відходить на другий план. У бою Бернис використовує два вогнемети, а її товариші описують її як дуже товариську особу.","personality_ua":"Захоплена, щира й надзвичайно товариська. Її пристрасть до палива затьмарює майже все інше.","guide":{"playstyle_ua":"Бернис накопичує й витрачає ресурс Heat: вона починає бій зі 100 Heat, а від 50 Heat входить у стан Nitro-Fuel Cocktail, де її удари накладають Scorched. Коли союзники б'ють підпалених ворогів, спрацьовує Afterburn. Типова тактика — накласти підпал, піти з поля і лише ненадовго повертатись, щоб поповнити Heat через EX-спеціальні атаки.","strengths_ua":["Потребує мало часу на полі","Накладає сильну вогняну аномалію, добра для команд Burn чи Disorder","Проста у керуванні"],"weaknesses_ua":["Залежить від Energy та ультимейту для генерації Heat, тож потрібне керування ресурсами","Заряджена базова атака коштує 20 Heat, і Heat швидко закінчується"],"best_team_ua":"Підходить Велина (Velina) або Ремієль (Remielle) як аномальні-партнери, а також Юдзуха (Ukinami Yuzuha) чи Нангун Ю (Nangong Yu), якщо перших немає: вони допомагають підтримувати Heat і накопичувати аномалію.","disc_drive_ua":"Найкраще: 4 предмети Chaos Jazz + 2 предмети Puffer Electro (альтернативи: Freedom Blues, Phaethon's Melody). Слот 4: Anomaly Proficiency, слот 5: PEN або Fire DMG%, слот 6: Anomaly Mastery.","w_engine_ua":"Найкращий: Flamemaker Shaker (сигнатурний). Безкоштовна/дешева альтернатива: Weeping Gemini; найкраща 4★ — Electro-Lip Gloss (боєвий пропуск).","tips_ua":["Відкривайте бій затиснутою базовою атакою, щоб накласти Scorched і зберегти Energy.","Ультимейт використовуйте для швидкого поповнення Heat, коли його менше 50.","Враховуйте перезарядку 7,5 с у Chaos Jazz під час заміни героя."],"difficulty":2},"stats_hint":{"atk_style_ua":"Ближній/середній бій, два вогнемети, підпал поза полем","stun_ability":1,"anomaly_ability":5,"survivability":2,"estimated":true},"uncertain":["best_team_ua: імена Velina, Remielle, Nangong Yu узяті зі скороченого переказу сторінки Prydwen; Icy Veins команд не називає — варто перевірити в грі","Prydwen у витягнутому тексті не дав назв W-Engine та головних характеристик слотів; використано дані Icy Veins","species не вказано на жодному джерелі","story_ua: офіційної передісторії на перевірених сайтах немає; використано профіль Prydwen і Wikipedia"]},{"id":"yixuan","name_en":"Yixuan","name_ua":"Іксюань","rarity":"S","element":"Auric Ink","specialty":"Rupture","faction_en":"Yunkui Summit","faction_ua":"Вершина Юнькуй (Yunkui Summit)","role_ua":"Основний DPS (Rupture, Sheer DMG)","species_or_background_ua":"Тринадцята майстриня храму бойових мистецтв Yunkui Summit на півострові Вайфей","tagline_ua":"Майстриня чорнила та небесних знаків","story_ua":"Іксюань очолює Yunkui Summit — храм бойових мистецтв на півострові Вайфей, де вона має титул Тринадцятого Високого наставника. Вона навчає інших читати небесні знаки й передбачати погоду, а Цзюй Фуфу (Ju Fufu) є її ученицею. У розмовах вона любить піддражнювати співрозмовників. Її сила пов'язана з унікальним атрибутом Auric Ink, який у грі подається як різновид ефіру.","personality_ua":"Грайлива й дражлива у розмовах, але наділена авторитетом і мудрістю наставниці.","guide":{"playstyle_ua":"Замість Energy Іксюань використовує Adrenaline і отримує очки технік (Technique Points), витрачаючи його, щоб відкривати посилені атаки та ультимейт Endless Talisman Suppression. Її головна шкода — Sheer DMG, що ігнорує захист ворога і масштабується від HP. Вона довго стоїть на полі, парирує атаки й приберігає найсильніші удари для вікна оглушення.","strengths_ua":["Дуже висока Sheer-шкода, одна з найвищих у грі","Масштабується від HP, а ультимейт перерозподіляє HP між командою","Гнучка, з багатьма варіантами комбо і хорошою мобільністю"],"weaknesses_ua":["Залежить від агресії ворогів для ідеальних ухилень та асистів — проти пасивних ворогів слабшає","Потребує спеціальних напарників, а DEF, PEN і Energy Regen їй майже не допомагають"],"best_team_ua":"Найпопулярніша команда — Цзюй Фуфу (Ju Fufu) і Лючія (Lucia): вона грає в парі з бійцями Yunkui Summit. Також добре підходять Пань Іньху (Pan Yinhu) як захисник і Астра Яо (Astra Yao).","disc_drive_ua":"Найкраще: 4 предмети Yunkui Tales + 2 предмети Woodpecker Electro (або Branch & Blade Song). Слот 4: Crit Rate або Crit DMG, слот 5: Ether DMG% (або HP%), слот 6: HP%.","w_engine_ua":"Найкращий: Qingming Birdcage (сигнатурний). Альтернативи: Puzzle Sphere та Cauldron of Clarity. Безкоштовність жодного з них не підтверджена.","tips_ua":["Перед кожним вікном оглушення накопичуйте 90–100 Adrenaline.","Приберігайте Cloud-Shaper для оглушення: тоді він завдає більше шкоди.","Використовуйте Auric Array переважно після вибуху в оглушення, щоб відновити Adrenaline."],"difficulty":4},"stats_hint":{"atk_style_ua":"Ближній бій, чорнильні техніки та Sheer-шкода","stun_ability":2,"anomaly_ability":1,"survivability":3,"estimated":true},"uncertain":["species: не вказано на жодному джерелі","титул «Тринадцятий Високий наставник» — Wikipedia; Icy Veins пише «Thirteenth Generation Master»","W-Engine: Cauldron of Clarity — Prydwen, Radiowave Journey — thebackdash; безкоштовних варіантів не знайдено","точні назви слотів 5/6 розходяться (Ether DMG% vs HP%); Prydwen віддає перевагу Ether DMG%","story_ua: детальної передісторії на перевірених сайтах немає"]},{"id":"alice-thymefield","name_en":"Alice Thymefield","name_ua":"Аліса Таймфілд","rarity":"S","element":"Physical","specialty":"Anomaly","faction_en":"Spook Shack","faction_ua":"Spook Shack («Хатина привидів»)","role_ua":"Основний DPS (Physical Anomaly)","species_or_background_ua":"Кролиця-тірен породи Netherland Dwarf, нащадок наукового роду Thymefield","tagline_ua":"Учена шляхтянка з клинком етикету","story_ua":"Аліса походить із шанованого вченого роду Таймфілд і сама каже, що виросла в «науковій родині». Вона бере участь у Spook Shack — онлайн-форумі, який досліджує надприродні таємниці. За словами джерел, вона виглядає стриманою й відважною, хоч інколи втрачає самовладання. У бою Аліса відстежує аномальні параметри, щоб розпізнати справжню форму супротивника.","personality_ua":"Стримана, відважна й трохи педантична. Іноді втрачає самовладання.","guide":{"playstyle_ua":"Аліса залишається на полі й накопичує ресурс Blade Etiquette (макс. 300) своїми діями, ухиленнями та Assault/Disorder. Коли він повний, вона виконує зарядну атаку Starshine Waltz і скасовує її довгу анімацію заміною героя. Після більшості умінь вона з'єднує їх із посиленою базовою атакою 5.","strengths_ua":["Висока та доступна фізична аномальна шкода","Багато кадрів невразливості в комбо","Гнучкі команди та диски, особливо для тих, хто вже збудував Джейн Доу чи Пайпер"],"weaknesses_ua":["Сильно залежить від сигнатурного W-Engine, щоб випередити Джейн і Пайпер","Вороги, що переривають її ритм, знижують ефективність"],"best_team_ua":"Найкраща підтримка — Юдзуха (Ukinami Yuzuha), а найкращий позаігровий DPS-партнер — Вівіан (Vivian). Також добре з Джейн Доу (Jane Doe) або Міябі (Miyabi) для подвійного Anomaly-складу.","disc_drive_ua":"Найкраще: 4 предмети Fanged Metal + 2 предмети Phaethon's Melody (або Puffer Electro). Слот 4: Anomaly Proficiency, слот 5: PEN або Physical DMG%, слот 6: Anomaly Mastery.","w_engine_ua":"Найкращий: Practiced Perfection (сигнатурний). Безкоштовна/дешева альтернатива: Weeping Gemini; також Fusion Compiler (S5).","tips_ua":["Після швидкої допомоги, EX-спеціальної, контратаки ухиленням та ланцюгової атаки одразу вставляйте базову атаку 5.","Використовуйте EX-спеціальні атаки, щоб запускати ідеальні ухилення й додатково отримувати Blade Etiquette.","Ультимейт застосовуйте, лише коли Blade Etiquette менше 100: він відновлює 200."],"difficulty":2},"stats_hint":{"atk_style_ua":"Ближній бій, фізичні комбо з клинком","stun_ability":2,"anomaly_ability":5,"survivability":3,"estimated":true},"uncertain":["species (Netherland Dwarf rabbit Thiren) і опис «uptight» — лише Wikipedia","faction_ua: «Хатина привидів» — мій переклад, не офіційний","story_ua: офіційної передісторії на перевірених сайтах немає; використано лише факти профілю та цитати","Prydwen описує безкоштовний A-ранг двигун без назви; назву Weeping Gemini дає Icy Veins"]},{"id":"astra-yao","name_en":"Astra Yao","name_ua":"Астра Яо","rarity":"S","element":"Ether","specialty":"Support","faction_en":"Stars of Lyra","faction_ua":"«Зірки Ліри» (Stars of Lyra)","role_ua":"Підтримка (баффи та лікування)","species_or_background_ua":"Співачка й акторка з музичного гурту Stars of Lyra у Новому Еріду","tagline_ua":"Зірка сцени, що тікає від роботи","story_ua":"Астра Яо — безтурботна співачка й акторка з відомого гурту Stars of Lyra у Новому Еріду. У представленні вона жартома пропонує втекти на день з роботи до Reverb Arena. Вона бачить себе артисткою, що може дарувати надію людям своєї епохи. Бойовий стиль Астри будується навколо музики й підтримки: вона стоїть позаду й підсилює всю команду.","personality_ua":"Безтурботна, грайлива, любить увагу публіки. Вірить, що її мистецтво дарує людям надію.","guide":{"playstyle_ua":"Астра заходить у стан Idyllic Cadenza через спеціальну атаку й залишається на полі навіть після заміни героя. Звідти вона дає бафи та швидкі допомоги. Їй потрібно мало часу на полі: основна ідея — грати з двома активними агентами.","strengths_ua":["Підходить майже будь-якій команді","Підсилює всю команду, зокрема великим бафом ATK","Лікує союзників і забезпечує часті швидкі допомоги та ланцюгові атаки"],"weaknesses_ua":["Змушує грати в стилі двох активних агентів, що подобається не всім","Лікування ультимейту фіксоване (до 2 700 HP) і не масштабується від прокачки"],"best_team_ua":"Ідеально доповнює Міябі (Miyabi) і Янагі (Tsukishiro Yanagi) або Іксюань (Yixuan) з Лючією (Lucia): вона посилює їхню шкоду та часто викликає швидкі допомоги."," /* ---------- glossary linking ---------- */
const GL = D.glossary.map((g) => ({ ...g, stem: g.term_ua.replace(/\s*\(.*\)\s*$/, '').replace(/[«»]/g, '') })).filter((g) => g.stem.length >= 4);
function linkTerms(text, max = 5) {
  const seen = new Set(); let n = 0;
  const alts = GL.map((g) => g.stem.length > 5 ? g.stem.slice(0, -1) : g.stem).map((s, i) => [s, i]).sort((a, b) => b[0].length - a[0].length);
  const re = new RegExp('(?<![\\p{L}\\d])(' + alts.map((a) => a[0].replace(/[.*+?^${}()|[\]\\/]/g, '\\$&')).join('|') + ')[\\p{L}]*', 'giu');
  return esc(text).replace(re, (m, g1) => {
    const hit = alts.find((a) => a[0].toLowerCase() === g1.toLowerCase()); if (!hit) return m;
    if (seen.has(hit[1]) || n >= max) return m; seen.add(hit[1]); n++;
    return `<span class="term" data-term="${hit[1]}">${m}</span>`;

}

function evalSquad(ids) {
  const as = ids.filter(Boolean).map(agent);
  let pair = false; for (let i = 0; i < as.length; i++) for (let j = i + 1; j < as.length; j++) if (elKey(as[i]) === elKey(as[j]) || facName(as[i]) === facName(as[j])) pair = true;
  const checks = [
    ['Є оглушувач (Stun)', as.some((a) => a.specialty === 'Stun'), 'Оглушувач збиває шкалу Daze і відкриває вікно для шкоди.'],
    ['Є головний шкодочин', as.some((a) => ['Attack', 'Anomaly', 'Rupture'].includes(a.specialty)), 'Потрібен той, хто реально завдає шкоди у вікно оглушення.'],
    ['Є підтримка або захист', as.some((a) => ['Support', 'Defense'].includes(a.specialty)), 'Баффи та щити роблять команду стійкішою.'],
    ['Двоє мають однаковий атрибут чи фракцію', pair, 'Це відкриває бонус Додаткової здатності.'],
    ['Склад зібрано (3 з 3)', as.length === 3, 'У бойовому загоні три Агенти та один Bangboo.'],
  ];
  return { checks, score: checks.filter((c) => c[1]).length * 20 };
}

    $('#auto', el).onclick = () => {
      let bestS = -1, bestT = []; let fixed = S.squad.filter(Boolean); if (fixed.length >= 3) fixed = [];
      for (let i = 0; i < AG.length; i++) for (let j = i + 1; j < AG.length; j++) for (let k = j + 1; k < AG.length; k++) { const t = [AG[i].id, AG[j].id, AG[k].id]; if (!fixed.every((f) => t.includes(f))) continue; const sc = evalSquad(t).score + Math.random() * 0.5; if (sc > bestS) { bestS = sc; bestT = t; } }
      const order = [...fixed, ...bestT.filter((x) => !fixed.includes(x))]; S.squad = order; save(); sfx.win(); vib([15, 30, 15]); render(); toast('Підібрано найкращу синергію', 'bolt'); if (S.squad.every(Boolean)) award('cmd');

  },
};

/* ---------- SEARCH OVERLAY ---------- */
function searchIndex() {
  const out = [];
  AG.forEach((a) => out.push({ k: 'Агент', t: a.name_ua, s: a.name_en + ' · ' + a.tagline_ua, hay: [a.name_ua, a.name_en, a.faction_ua, a.tagline_ua, a.role_ua].join(' '), go: () => go('agent', { id: a.id }) }));
  D.world.forEach((w, i) => out.push({ k: 'Світ', t: w.title_ua, s: w.summary_ua, hay: w.title_ua + ' ' + w.title_en + ' ' + w.summary_ua, go: () => go('article', { i }) }));
  D.glossary.forEach((g, i) => { const gi = GL.findIndex((x) => x.term_en === g.term_en); out.push({ k: 'Термін', t: g.term_ua, s: g.def_ua, hay: g.term_ua + ' ' + g.term_en + ' ' + g.def_ua, go: () => (gi >= 0 ? openTerm(gi) : openSheet(`<h3 class="h-disp h2">${esc(g.term_ua)}</h3><p style="color:var(--soft);line-height:1.6">${esc(g.def_ua)}</p>`)) }); });
  D.factions.forEach((f, i) => out.push({ k: 'Фракція', t: f.name_ua, s: f.one_line_ua, hay: f.name_ua + ' ' + f.name_en + ' ' + f.one_line_ua, go: () => openFaction(i) }));
  D.mechanics.forEach((m) => out.push({ k: 'Урок', t: m.term_ua, s: m.explain_ua, hay: m.term_ua + ' ' + m.term_en + ' ' + m.explain_ua, go: () => go('lesson', { id: m.id }, { dir: 'up' }) }));
  return out;
}
let SIDX = null;
const hl = (s, q) => { if (!q) return esc(s); const i = s.toLowerCase().indexOf(q.toLowerCase()); if (i < 0) return esc(s); return esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length)); };
function openSearch(preset) {
  const o = $('#ovl'); SIDX = SIDX || searchIndex();
  o.innerHTML = `<div class="row" style="padding:12px 20px"><label class="search" style="flex:1">${ico('search')}<input id="sq" placeholder="Агент, термін, фракція…" autocomplete="off"></label><button class="icon-btn" id="sc" aria-label="Закрити">${ico('close')}</button></div><div class="res" id="rs"></div>`;
  o.classList.add('show'); sfx.nav();
  const input = $('#sq', o), rs = $('#rs', o);
  const draw = () => {
    const q = input.value.trim();
    if (!q) { rs.innerHTML = `<div class="eyebrow" style="margin:8px 0">Спробуй</div><div style="display:flex;flex-wrap:wrap;gap:8px">${['Анбі', 'Порожнина', 'Оглушення', 'Лід', 'Проксі', 'Хитрі зайці'].map((x) => `<button class="chip" data-q="${x}">${x}</button>`).join('')}</div>`; return; }
    const L = SIDX.filter((r) => r.hay.toLowerCase().includes(q.toLowerCase())).slice(0, 30);
    rs.innerHTML = L.length ? L.map((r, i) => `<button class="r rise" style="--i:${Math.min(i, 6)}" data-r="${SIDX.indexOf(r)}"><span class="k">${r.k}</span><span style="min-width:0;flex:1"><b>${hl(r.t, q)}</b><small style="display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden">${esc(r.s)}</small></span></button>`).join('') : emptyState('Нічого не знайдено', 'Перевір написання або спробуй інше слово');
  };
  input.oninput = draw; draw();
  on(rs, 'click', '[data-q]', (e, b) => { input.value = b.dataset.q; draw(); });
  on(rs, 'click', '[data-r]', (e, b) => { const r = SIDX[+b.dataset.r]; closeSearch(); setTimeout(() => r.go(), 220); });
  $('#sc', o).onclick = () => closeSearch();
  if (preset) { input.value = preset; draw(); }
  if (!STATIC) setTimeout(() => input.focus({ preventScroll: true }), 350);
}
function closeSearch() { const o = $('#ovl'); o.classList.remove('show'); sfx.tap(); }

/* ===== MAIN: boot, tabbar, rails, init ===== */
function buildShell() {
  $('#tabbar').innerHTML = `<span class="pill"></span>${TABS.map((t) => `<button class="t" data-tab="${t[0]}" aria-label="${t[1]}">${ico(t[2])}<span>${t[1]}</span></button>`).join('')}`;
  on($('#tabbar'), 'click', '.t', (e, b) => {
    const n = b.dataset.tab, cur = topInst();
    if (cur && cur.name === n) { cur.el.scrollTo({ top: 0, behavior: 'smooth' }); sfx.tap(); return; }
    sfx.nav(); vib(8); go(n, {}, { dir: 'root' });
  });
  $('#scrim').onclick = () => closeSheet();
  document.addEventListener('pointerdown', (e) => { const b = e.target.closest('.btn'); if (b) ripple(e, b); const c = e.target.closest('button,.slot,.acc'); if (c && !c.classList.contains('t') && !c.classList.contains('node')) sfx.tap(); }, { passive: true });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('#sheet').classList.contains('show')) closeSheet(); else if ($('#ovl').classList.contains('show')) closeSearch(); else back(); } });
  const clock = () => { const d = new Date(); const s = $('#clock'); if (s) s.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }; clock(); setInterval(clock, 20000);

  ['Академія · шлях', '09', () => go('academy', {}, { dir: 'root' })],

function buildRails() {
  const L = $('#railL'), R = $('#railR'); if (!L || !R) return;
  L.innerHTML = `<div class="eyebrow">Практична №2 · UI/UX</div><div class="h-disp" style="font-size:44px;margin-top:6px">Досьє<br><span style="color:var(--acid)">Ерідо</span></div><p>Мобільний інформаційно-навчальний додаток про всесвіт Zenless Zone Zero: світ, хроніка, фракції, 16 Агентів з історією та гайдом, Академія й вікторина.</p>
  <div class="tip"><h4>Спробуй</h4><ul><li>Торкнись постера Агента — <b>спільний перехід</b></li><li>Свайп по обкладинці Агента — наступний</li><li>Серце — вибух частинок і вібрація</li><li>Академія → урок → <b>конфеті</b></li><li>Потягни шторку вниз, щоб закрити</li></ul></div>
  <p style="font-size:11.5px;color:var(--dim)">Неофіційний фанатський проєкт. Не пов'язаний з HoYoverse. Ілюстрації — оригінальні абстрактні постери.</p>`;
  R.innerHTML = `<h4>Розмір екрана</h4><div class="seg" id="sizes" style="margin-bottom:6px"><span class="thumb"></span><button>360×640</button><button>375×667</button><button class="on">414×896</button></div><p style="font-size:11.5px;color:var(--dim)">Android · iOS · великий — розміри з методички.</p>
  <h4 style="margin-top:8px">Екрани прототипу</h4><div class="jump">${JUMPS.map((j, i) => `<button data-j="${i}">${j[0]}<small>${j[1]}</small></button>`).join('')}</div>`;
  on(R, 'click', '[data-j]', (e, b) => { closeSheet(); closeSearch(); JUMPS[+b.dataset.j][2](); });
  const sizes = [[360, 640], [375, 667], [414, 896]]; const sg = $('#sizes', R);
  const place = (i) => { const b = $$('button', sg)[i], th = $('.thumb', sg); th.style.width = b.offsetWidth + 'px'; th.style.transform = `translateX(${b.offsetLeft - 4}px)`; $$('button', sg).forEach((x, k) => x.classList.toggle('on', k === i)); };
  setTimeout(() => place(2), 50);
  on(sg, 'click', 'button', (e, b) => { const i = $$('button', sg).indexOf(b); place(i); document.documentElement.style.setProperty('--dw', sizes[i][0] + 'px'); document.documentElement.style.setProperty('--dh', sizes[i][1] + 'px'); sfx.tap(); });

function startApp(fromOnboarding) {
  applyOpts();
  const h = (location.hash || '').replace('#', '');
  if (!S.user.done) { go('onboard', {}, { dir: 'root' }); return; }
  if (!fromOnboarding && h.startsWith('agent-') && agent(h.slice(6))) { go('home', {}, { dir: 'root' }); setTimeout(() => go('agent', { id: h.slice(6) }), 50); return; }
  if (!fromOnboarding && TABS.some((t) => t[0] === h)) { go(h, {}, { dir: 'root' }); return; }
  go('home', {}, { dir: 'root' });
  if (fromOnboarding) setTimeout(() => toast(`Вітаю в Інтер-Нот, ${S.user.name}!`, 'bolt'), 700);
}

function boot() {
  const b = $('#boot');
  if (STATIC) { b.remove(); startApp(false); return; }
  const done = S.user.done;
  b.innerHTML = `<button class="tap" id="pw" aria-label="Увімкнути"><span class="power">${ico('power')}</span><span>Торкнись, щоб увімкнути</span></button>`;
  $('#pw', b).onclick = async () => {
    ac(); sfx.boot(); vib(30); b.classList.add('on-anim');
    b.innerHTML = `<div class="screen-on"><div class="logo">Досьє<br><em>Ерідо</em></div><div class="mono muted" style="font-size:11px;letter-spacing:.18em">ZENLESS ZONE ZERO · FAN GUIDE</div><div class="bar"><i id="bi"></i></div><div class="msg" id="bm"></div></div>`;
    const msgs = ['ПІДКЛЮЧЕННЯ ДО ІНТЕР-НОТ…', 'ЗАВАНТАЖЕННЯ ДОСЬЄ АГЕНТІВ…', 'СИНХРОНІЗАЦІЯ ХРОНІКИ…', 'ГОТОВО'];
    const dur = done ? 380 : 620;
    for (let i = 0; i < msgs.length; i++) { await wait(i ? dur : 700); $('#bm').textContent = msgs[i]; $('#bi').style.width = ((i + 1) / msgs.length) * 100 + '%'; if (i < 3) sfx.tick(); }
    await wait(350); b.style.transition = 'opacity .45s'; b.style.opacity = 0; startApp(false); setTimeout(() => b.remove(), 480);
  };
}

function init() {
  const root = document.documentElement;
  if (STATIC) root.classList.add('static');
  buildShell(); buildRails(); applyOpts(); boot();
  if (location.hash === '#wire') document.body.classList.add('wire');
}
init();
window.__app = { go, back, S: () => S, openAgent, openSearch, openFaction, openTerm, SCREENS, stack, AG, D, startApp, openSheet, closeSheet, confetti };

})();
