<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Досьє Ерідо</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>/* Concept: pocket dossier from a retro-futurist TV city. Black glass, acid-yellow stamps, hazard tape, halftone, chamfered tags. One bold move: the CRT power-on + glitch titles. */
:root{
  --ink:#0C0D10; --ink2:#14161B; --ink3:#1D2027; --line:#2A2E38; --line2:#3A3F4C;
  --paper:#F1EEE3; --soft:#C9CCD6; --muted:#9097A6; --dim:#6A7080;
  --acid:#DFFF2E; --acid2:#B8D81A; --acidink:#10130A;
  --hot:#FF4D2E; --cyan:#4FE3FF; --violet:#8C7CFF; --pink:#FF5CB8; --amber:#F0B73C; --good:#5BE38B; --bad:#FF5A5A;
  --f-display:'Oswald','Arial Narrow','Liberation Sans Narrow','DejaVu Sans Condensed',Impact,sans-serif;
  --f-body:'Onest','Inter','Helvetica Neue',Arial,sans-serif;
  --f-mono:'JetBrains Mono','DejaVu Sans Mono','Liberation Mono',monospace;
  --dw:414px; --dh:896px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acid);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- stage (desktop presentation around the device) ---------- */
.stage{height:100%;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;background:
  radial-gradient(1200px 600px at 50% -10%,#1b2016 0%,transparent 60%),
  repeating-linear-gradient(135deg,#0c0d10 0 14px,#0f1115 14px 28px)}
.rail{display:none}
@media (min-width:1040px){
  .stage{grid-template-columns:260px var(--dw) 260px;gap:40px;justify-content:center;padding-inline:24px}
  .rail{display:flex;flex-direction:column;gap:14px;align-self:center;max-height:92vh;overflow:auto;padding:4px}
}
.rail h4{margin:0 0 2px;font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--acid)}
.rail p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.rail .jump{display:grid;gap:6px}
.rail .jump button{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--ink2);font:500 13px var(--f-body);text-align:left;transition:.18s}
.rail .jump button:hover{border-color:var(--acid);color:var(--acid);transform:translateX(3px)}
.rail .jump button small{font:500 10px var(--f-mono);color:var(--dim)}
.rail .tip{padding:12px;border:1px dashed var(--line2);border-radius:8px}
.rail .tip b{color:var(--paper);font-weight:600}
.rail ul{margin:6px 0 0;padding-left:16px;color:var(--muted);font-size:13px;display:grid;gap:4px}

.device{position:relative;width:min(var(--dw),100vw);height:min(var(--dh),100%);background:var(--ink);overflow:hidden;isolation:isolate}
@media (min-width:500px) and (min-height:700px){.device{border-radius:38px;box-shadow:0 0 0 10px #050506,0 0 0 11px #2a2e38,0 40px 80px -20px #000,0 0 120px -30px rgba(223,255,46,.18)}}
.statusbar{position:absolute;inset:0 0 auto 0;height:30px;display:none;align-items:center;justify-content:space-between;padding:6px 26px 0;font:600 12px var(--f-mono);z-index:60;pointer-events:none;mix-blend-mode:difference;color:#fff}
@media (min-width:500px) and (min-height:700px){.statusbar{display:flex}.view{padding-top:30px}}
.statusbar i{display:inline-block;width:22px;height:10px;border:1.5px solid #fff;border-radius:3px;position:relative}
.statusbar i::after{content:"";position:absolute;inset:1px 5px 1px 1px;background:#fff;border-radius:1px}

/* CRT layer */
.crt{position:absolute;inset:0;pointer-events:none;z-index:80;opacity:.55;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.crt::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.45) 100%)}
.no-crt .crt{display:none}
.device.flicker::before{content:"";position:absolute;inset:0;z-index:79;pointer-events:none;background:rgba(223,255,46,.03);animation:flick 5s steps(1) infinite}
@keyframes flick{0%,96%,100%{opacity:0}97%{opacity:1}98%{opacity:0}99%{opacity:1}}

/* ---------- views & transitions ---------- */
.views{position:absolute;inset:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;background:var(--ink);scrollbar-width:none;will-change:transform,opacity}
.view::-webkit-scrollbar{display:none}
.view.has-tabs{padding-bottom:92px}
.v-in-fwd{animation:inFwd .42s cubic-bezier(.2,.8,.2,1) both}
.v-out-fwd{animation:outFwd .42s cubic-bezier(.2,.8,.2,1) both}
.v-in-back{animation:inBack .42s cubic-bezier(.2,.8,.2,1) both}
.v-out-back{animation:outBack .42s cubic-bezier(.2,.8,.2,1) both}
.v-in-fade{animation:inFade .34s ease both}
.v-out-fade{animation:outFade .24s ease both}
.v-in-up{animation:inUp .5s cubic-bezier(.2,.9,.2,1) both}
@keyframes inFwd{from{transform:translateX(34%);opacity:0}to{transform:none;opacity:1}}
@keyframes outFwd{from{transform:none;opacity:1}to{transform:translateX(-18%) scale(.97);opacity:0}}
@keyframes inBack{from{transform:translateX(-18%) scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes outBack{from{transform:none;opacity:1}to{transform:translateX(34%);opacity:0}}
@keyframes inFade{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:none}}
@keyframes outFade{to{opacity:0}}
@keyframes inUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.rise{opacity:0;transform:translateY(16px);animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0)*55ms + 120ms)}
@keyframes rise{to{opacity:1;transform:none}}
.static .rise,.static .v-in-fwd,.static *{animation:none!important;transition:none!important}
.static .rise{opacity:1;transform:none}
.reduce *,.reduce *::before,.reduce *::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}

/* ---------- shared atoms ---------- */
.eyebrow{font:600 10.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acid);display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--acid)}
.h-disp{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:.98;margin:0;transform:skewX(-6deg)}
.h1{font-size:46px}.h2{font-size:32px}.h3{font-size:22px}
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;inset:0;pointer-events:none;opacity:.0}
.glitch::before{color:var(--cyan);transform:translate(-2px,0);clip-path:inset(0 0 55% 0)}
.glitch::after{color:var(--hot);transform:translate(2px,0);clip-path:inset(55% 0 0 0)}
.glitch.run::before,.glitch.run::after{animation:gl .5s steps(2) 1}
@keyframes gl{0%{opacity:.9;transform:translate(-4px,1px)}33%{opacity:.9;transform:translate(3px,-1px)}66%{opacity:.9;transform:translate(-2px,0)}100%{opacity:0}}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.pad{padding-inline:20px}
.sp{flex:1}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 8px;font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;background:var(--ink3);color:var(--soft);clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,0 100%)}
.tag.acid{background:var(--acid);color:var(--acidink)}
.tag svg{width:13px;height:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px solid var(--line2);border-radius:999px;font:500 13px var(--f-body);color:var(--soft);background:var(--ink2);white-space:nowrap;transition:transform .16s,background .2s,color .2s,border-color .2s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--acid);color:var(--acidink);border-color:var(--acid);font-weight:600}
.chip svg{width:15px;height:15px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;font:700 15px var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:var(--acid);color:var(--acidink);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));transition:transform .15s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--ink3);color:var(--paper)}
.btn.block{width:100%}
.btn svg{width:20px;height:20px}
.btn .rip{position:absolute;border-radius:50%;background:rgba(0,0,0,.25);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:12px;background:var(--ink2);transition:transform .16s,border-color .2s}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:22px;height:22px}
.hazard{height:10px;background:repeating-linear-gradient(-45deg,var(--acid) 0 10px,#0c0d10 10px 20px)}
.dots{background-image:radial-gradient(rgba(255,255,255,.09) 1.2px,transparent 1.3px);background-size:9px 9px}
.card{position:relative;background:var(--ink2);border:1px solid var(--line);border-radius:10px}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.heart.on path{fill:var(--hot);stroke:var(--hot)}
.heart.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.burst{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:99;animation:burst .7s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:relative;padding:4px;background:var(--ink2);border:1px solid var(--line);border-radius:12px}
.seg button{position:relative;z-index:1;padding:10px 6px;font:600 13px var(--f-body);color:var(--muted);transition:color .25s}
.seg button.on{color:var(--acidink)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:9px;background:var(--acid);transition:transform .35s cubic-bezier(.3,1.2,.4,1),width .35s}

/* ---------- boot ---------- */
.boot{position:absolute;inset:0;background:#000;z-index:70;display:grid;place-items:center;text-align:center}
.boot .tap{display:grid;gap:16px;justify-items:center;color:var(--muted);font:500 12px var(--f-mono);letter-spacing:.2em;text-transform:uppercase}
.boot .power{width:74px;height:74px;border-radius:50%;border:2px solid var(--acid);display:grid;place-items:center;color:var(--acid);animation:breathe 1.8s ease-in-out infinite}
.boot .power svg{width:30px;height:30px}
@keyframes breathe{50%{box-shadow:0 0 0 14px rgba(223,255,46,.08);transform:scale(1.05)}}
.boot.on-anim .screen-on{animation:crtOn .9s cubic-bezier(.2,.9,.2,1) both}
@keyframes crtOn{0%{transform:scale(1,.004);filter:brightness(6)}40%{transform:scale(1,.004);filter:brightness(6)}55%{transform:scale(1,1);filter:brightness(2.2)}100%{transform:none;filter:none}}
.boot .screen-on{display:grid;gap:22px;justify-items:center;width:100%;padding:0 34px}
.boot .logo{font:700 54px/0.9 var(--f-display);text-transform:uppercase;transform:skewX(-6deg)}
.boot .logo em{font-style:normal;color:var(--acid)}
.bar{position:relative;height:8px;width:100%;background:var(--ink3);overflow:hidden;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.bar i{position:absolute;inset:0;width:0;background:repeating-linear-gradient(-45deg,var(--acid) 0 8px,var(--acid2) 8px 16px);transition:width .5s cubic-bezier(.3,.7,.3,1)}
.boot .msg{font:500 11px var(--f-mono);letter-spacing:.12em;color:var(--muted);height:16px}

/* ---------- mascot ---------- */
.mascot{display:block}
.mascot .eye{transform-origin:center;animation:blink 4.2s infinite}
.mascot .ant{transform-origin:50% 100%;animation:ant 2.6s ease-in-out infinite}
.mascot .body{animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes ant{50%{transform:rotate(8deg)}}
@keyframes bob{50%{transform:translateY(-3px)}}

/* ---------- tab bar ---------- */
.tabbar{position:absolute;left:12px;right:12px;bottom:12px;height:68px;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px;background:rgba(20,22,27,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line2);border-radius:22px;box-shadow:0 14px 30px -10px #000}
.tabbar .t{position:relative;z-index:1;display:grid;justify-items:center;gap:2px;padding:6px 0;color:var(--muted);font:600 10px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;transition:color .25s}
.tabbar .t svg{width:23px;height:23px;transition:transform .35s cubic-bezier(.3,1.6,.4,1)}
.tabbar .t.on{color:var(--acidink)}
.tabbar .t.on svg{transform:translateY(-2px) scale(1.08)}
.tabbar .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:16px;background:var(--acid);transition:transform .42s cubic-bezier(.3,1.25,.4,1)}
.tabbar.hide{transform:translateY(120%);transition:transform .35s}
.tabbar{transition:transform .35s}

/* ---------- toast & sheet ---------- */
.toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,30px);opacity:0;z-index:90;display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--paper);color:var(--ink);border-radius:12px;font:600 13px var(--f-body);box-shadow:0 10px 30px -8px #000;pointer-events:none;transition:.35s cubic-bezier(.3,1.4,.4,1);max-width:86%}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--acid);flex:none}
.scrim{position:absolute;inset:0;z-index:84;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:85;max-height:78%;display:flex;flex-direction:column;background:var(--ink2);border-top:1px solid var(--line2);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.25,1)}
.sheet.show{transform:none}
.sheet.drag{transition:none}
.sheet .grab{padding:12px 0 6px;display:grid;place-items:center;touch-action:none;cursor:grab}
.sheet .grab i{width:44px;height:5px;border-radius:3px;background:var(--line2)}
.sheet .body{overflow:auto;padding:6px 22px 30px}

/* ---------- skeleton ---------- */
.sk{position:relative;overflow:hidden;background:var(--ink3);border-radius:10px}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);animation:shim 1.2s infinite}
@keyframes shim{to{transform:translateX(100%)}}

/* ---------- header bars ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 20px 12px;background:linear-gradient(var(--ink) 70%,transparent)}
.topbar .ttl{flex:1;min-width:0}
.topbar .ttl .h-disp{font-size:26px}
.tb-solid{background:rgba(12,13,16,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.progress-top{position:absolute;left:0;top:0;height:3px;width:0;background:var(--acid);z-index:30}

/* ---------- HOME ---------- */
.ticker{overflow:hidden;white-space:nowrap;border-block:1px solid var(--line);background:var(--ink2);font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.ticker .tk{display:inline-flex;gap:34px;padding:9px 0;animation:tick 34s linear infinite}
.ticker b{color:var(--acid);font-weight:600}
@keyframes tick{to{transform:translateX(-50%)}}
.hero-card{position:relative;margin:0 20px;border-radius:16px;overflow:hidden;height:372px;background:var(--ink3);isolation:isolate}
.hero-card .poster{position:absolute;inset:-10% -6% -6%;transition:transform .2s}
.hero-card .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(12,13,16,.94) 92%)}
.hero-card .info{position:absolute;left:18px;right:18px;bottom:18px;display:grid;gap:8px}
.hero-card .badge{position:absolute;top:14px;left:14px;z-index:2}
.hero-card .no{position:absolute;top:14px;right:14px;z-index:2;font:600 11px var(--f-mono);color:var(--paper);opacity:.8}
.tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
.tile{position:relative;overflow:hidden;min-height:118px;padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;background:var(--ink2);border:1px solid var(--line);border-radius:14px;transition:transform .2s,border-color .2s}
.tile:active{transform:scale(.97)}
.tile:hover{border-color:var(--acid)}
.tile .big{position:absolute;right:-8px;bottom:-14px;font:700 92px/1 var(--f-display);color:rgba(255,255,255,.05);transform:skewX(-6deg)}
.tile svg.ico{width:26px;height:26px;color:var(--acid)}
.tile .tt{font:700 19px var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.tile small{display:block;color:var(--muted);font-size:12px;line-height:1.3;margin-top:2px}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 20px 6px;scroll-snap-type:x proximity;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:none;scroll-snap-align:start}
.ring{position:relative;width:78px;height:78px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--ink3)}
.ring .fg{stroke:var(--acid);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font:700 20px var(--f-display)}
.did{perspective:900px;height:154px;margin:0 20px}
.did .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.2,.4,1);transform-style:preserve-3d}
.did.flip .in{transform:rotateY(180deg)}
.did .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:18px;border-radius:16px;display:flex;flex-direction:column;justify-content:space-between}
.did .a{background:var(--acid);color:var(--acidink)}
.did .b{background:var(--ink3);border:1px solid var(--acid);transform:rotateY(180deg)}
.did .a .h-disp{font-size:26px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px;margin:30px 0 12px}
.sec-h .h-disp{font-size:26px}
.sec-h button{font:600 12px var(--f-mono);color:var(--acid);letter-spacing:.06em;text-transform:uppercase}
.disc{padding:16px 20px 28px;margin-top:26px;font-size:11.5px;color:var(--dim);line-height:1.55;border-top:1px solid var(--line)}

/* ---------- AGENTS ---------- */
.search{position:relative;display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:var(--ink2);border:1px solid var(--line2);border-radius:14px;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--acid);box-shadow:0 0 0 4px rgba(223,255,46,.12)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px}
.search svg{width:20px;height:20px;color:var(--muted)}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 20px 0}
.acard{position:relative;display:block;text-align:left;aspect-ratio:3/4.1;border-radius:14px;overflow:hidden;background:var(--ink3);isolation:isolate;transition:transform .22s cubic-bezier(.3,1.3,.4,1)}
.acard:active{transform:scale(.96)}
.acard .poster{position:absolute;inset:0}
.acard .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(12,13,16,.92))}
.acard .meta{position:absolute;left:12px;right:12px;bottom:12px;z-index:2}
.acard .nm{font:700 21px/1 var(--f-display);text-transform:uppercase;transform:skewX(-6deg);letter-spacing:.02em}
.acard .fc{font:500 10.5px var(--f-mono);color:var(--soft);margin-top:4px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .rar{position:absolute;top:10px;left:10px;z-index:3}
.acard .fav{position:absolute;top:6px;right:6px;z-index:3;width:38px;height:38px;display:grid;place-items:center}
.acard .fav svg{width:22px;height:22px;stroke:var(--paper);fill:rgba(0,0,0,.35);stroke-width:1.8;transition:.2s}
.empty{display:grid;justify-items:center;gap:10px;text-align:center;padding:50px 30px;color:var(--muted)}
.pbtn.on{background:var(--acid)}

/* ---------- AGENT DETAIL ---------- */
.dhero{position:relative;height:440px;overflow:hidden;isolation:isolate}
.dhero .poster{position:absolute;inset:-4% -4% -4%;will-change:transform}
.dhero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,13,16,.55),transparent 28%,transparent 48%,var(--ink) 98%)}
.dhero .tools{position:absolute;top:calc(14px + 0px);left:16px;right:16px;display:flex;justify-content:space-between;z-index:5}
.dhero .tools .icon-btn{background:rgba(12,13,16,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dname{position:relative;margin-top:-92px;padding:0 20px;z-index:3;display:grid;gap:10px}
.dname .h1{font-size:54px}
.tabs{position:sticky;top:0;z-index:15;display:flex;gap:0;margin-top:18px;background:rgba(12,13,16,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:15px 4px;font:600 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);transition:color .25s}
.tabs button.on{color:var(--acid)}
.tabs .ul{position:absolute;bottom:-1px;left:0;height:3px;background:var(--acid);transition:transform .4s cubic-bezier(.3,1.2,.4,1),width .4s}
.pane{padding:24px 20px 140px;display:grid;gap:22px;animation:inUp .45s cubic-bezier(.2,.9,.2,1)}
.quote{font:600 28px/1.05 var(--f-display);text-transform:uppercase;transform:skewX(-6deg);padding-left:16px;border-left:4px solid var(--acid)}
.dl{display:grid;gap:0}
.dl>div{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line2);font-size:14px}
.dl dt{font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.dl dd{margin:0;color:var(--soft)}
.prose p{margin:0 0 14px;font-size:16px;line-height:1.66;color:var(--soft)}
.stat{display:grid;grid-template-columns:128px 1fr 26px;gap:12px;align-items:center;font-size:13.5px}
.stat .t{height:9px;background:var(--ink3);clip-path:polygon(0 0,100% 0,calc(100% - 5px) 100%,0 100%);position:relative;overflow:hidden}
.stat .t i{position:absolute;inset:0;width:0;background:var(--c,var(--acid));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.stat b{font:700 15px var(--f-display);text-align:right}
.pc{display:grid;gap:8px}
.pc div{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--soft);line-height:1.5}
.pc svg{flex:none;width:18px;height:18px;margin-top:2px}
.acc{border:1px solid var(--line);border-radius:12px;background:var(--ink2);overflow:hidden}
.acc button{width:100%;display:flex;gap:12px;align-items:center;padding:14px 16px;text-align:left;font:600 14px var(--f-body)}
.acc button .n{font:700 13px var(--f-mono);color:var(--acid)}
.acc button svg{margin-left:auto;transition:transform .35s;width:18px;height:18px}
.acc.open button svg{transform:rotate(180deg)}
.acc .pnl{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.3,1,.3,1)}
.acc.open .pnl{grid-template-rows:1fr}
.acc .pnl>div{overflow:hidden}
.acc .pnl p{margin:0;padding:0 16px 16px;font-size:14px;color:var(--soft);line-height:1.6}
.kit{display:grid;gap:10px}
.kit .k{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--ink2)}
.kit .k h5{margin:0 0 6px;font:600 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acid)}
.kit .k p{margin:0;font-size:14px;color:var(--soft);line-height:1.55}
.cta-bar{position:absolute;left:0;right:0;bottom:0;z-index:40;padding:14px 20px 22px;background:linear-gradient(transparent,var(--ink) 38%);display:flex;gap:10px}
.mate{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--ink2);text-align:left;transition:transform .18s,border-color .2s}
.mate:active{transform:scale(.97)}
.mate .pic{width:54px;height:54px;border-radius:10px;overflow:hidden;flex:none;position:relative}
.mate .pic svg{position:absolute;inset:0;width:100%;height:100%}
.note{font-size:12px;color:var(--dim);line-height:1.5;padding:12px 14px;border:1px dashed var(--line2);border-radius:10px}
.radar text{font:600 10px var(--f-mono);fill:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* ---------- UNIVERSE ---------- */
.tl{position:relative;padding:8px 20px 40px 52px}
.tl .spine{position:absolute;left:30px;top:0;bottom:0;width:2px;background:var(--line)}
.tl .spine i{position:absolute;left:0;top:0;width:2px;height:0;background:var(--acid);box-shadow:0 0 12px var(--acid)}
.season{position:relative;margin:26px -20px 18px -52px;padding:12px 20px 12px 52px;background:var(--acid);color:var(--acidink);font:700 20px var(--f-display);letter-spacing:.06em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%)}
.season small{display:block;font:600 10px var(--f-mono);letter-spacing:.14em}
.beat{position:relative;margin-bottom:14px;text-align:left;width:100%;display:block}
.beat::before{content:"";position:absolute;left:-30px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--ink);border:2px solid var(--line2);transition:.4s;z-index:2}
.beat.on::before{border-color:var(--acid);background:var(--acid);box-shadow:0 0 0 6px rgba(223,255,46,.15)}
.beat .card{padding:16px}
.beat .no{font:600 10.5px var(--f-mono);letter-spacing:.12em;color:var(--acid);text-transform:uppercase}
.beat h4{margin:6px 0 4px;font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.beat p{margin:0;font-size:14px;color:var(--soft);line-height:1.55}
.beat .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s}
.beat.open .more{grid-template-rows:1fr}
.beat .more>div{overflow:hidden}
.wgrid{display:grid;gap:12px;padding:6px 20px 0}
.wcard{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:14px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--ink2);transition:transform .2s,border-color .2s}
.wcard:active{transform:scale(.97)}
.wcard:hover{border-color:var(--acid)}
.wcard .wi{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;background:var(--ink3);position:relative;overflow:hidden}
.wcard .wi svg{width:36px;height:36px;color:var(--acid)}
.wcard h4{margin:0;font:700 19px var(--f-display);text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.wcard p{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art-hero{position:relative;padding:68px 20px 26px;overflow:hidden;background:var(--ink2);border-bottom:1px solid var(--line)}
.art-hero .big{position:absolute;right:-20px;top:20px;width:210px;height:210px;color:var(--acid);opacity:.12}
.art-hero .big svg{width:100%;height:100%;stroke-width:1}
.term{color:var(--acid);border-bottom:1px dashed var(--acid);cursor:pointer;white-space:nowrap}
.graph{position:relative;margin:0 20px;height:420px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--ink2)}
.graph svg{width:100%;height:100%;display:block}
.gn{cursor:pointer}
.gn circle{transition:r .3s,stroke-width .3s,fill .3s}
.gn text{font:600 9px var(--f-mono);fill:var(--soft);text-anchor:middle;pointer-events:none;letter-spacing:.02em}
.ge{stroke:var(--line2);stroke-width:1;transition:.3s}
.ge.hl{stroke:var(--acid);stroke-width:1.6}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:12px 20px 0;font:500 11px var(--f-mono);color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

/* ---------- ACADEMY ---------- */
.path{position:relative;padding:10px 0 20px}
.mod{margin:0 20px 8px;padding:12px 16px;display:flex;align-items:center;gap:12px;background:var(--ink3);border-radius:12px;font:700 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.mod small{margin-left:auto;font:500 10.5px var(--f-mono);color:var(--muted)}
.node-row{display:flex;height:96px;align-items:center}
.node{position:relative;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--ink2);border:3px solid var(--line2);font:700 22px var(--f-display);color:var(--paper);transition:transform .2s;flex:none}
.node:active{transform:scale(.9)}
.node.done{background:var(--acid);border-color:var(--acid);color:var(--acidink)}
.node.cur{border-color:var(--acid);box-shadow:0 0 0 7px rgba(223,255,46,.14);animation:pulse 2s infinite}
.node.lock{opacity:.45}
.node svg{width:28px;height:28px}
@keyframes pulse{50%{box-shadow:0 0 0 13px rgba(223,255,46,.04)}}
.node-lbl{position:absolute;top:76px;left:50%;transform:translateX(-50%);width:130px;text-align:center;font:600 11.5px var(--f-body);color:var(--soft);line-height:1.2}
.lesson-card{min-height:340px;padding:26px;display:flex;flex-direction:column;gap:16px;border-radius:20px;background:var(--ink2);border:1px solid var(--line2);position:relative;overflow:hidden}
.lesson-card .big-n{position:absolute;right:-6px;top:-16px;font:700 130px/1 var(--f-display);color:rgba(255,255,255,.04);transform:skewX(-6deg)}
.dots-nav{display:flex;gap:6px;justify-content:center;padding:10px 0}
.dots-nav i{height:6px;width:6px;border-radius:3px;background:var(--line2);transition:.3s}
.dots-nav i.on{width:26px;background:var(--acid)}
.qopt{display:flex;gap:12px;align-items:center;width:100%;padding:16px;text-align:left;border:1.5px solid var(--line2);border-radius:14px;background:var(--ink2);font:500 15.5px var(--f-body);transition:transform .18s,border-color .2s,background .25s}
.qopt:active{transform:scale(.98)}
.qopt .l{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--ink3);font:700 13px var(--f-mono);flex:none}
.qopt.ok{border-color:var(--good);background:rgba(91,227,139,.13)}
.qopt.ok .l{background:var(--good);color:#06240f}
.qopt.no{border-color:var(--bad);background:rgba(255,90,90,.12);animation:shake .45s}
.qopt.no .l{background:var(--bad);color:#2b0606}
.qopt.dim{opacity:.45}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.timer{position:relative;width:54px;height:54px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:5}
.timer .fg{stroke:var(--acid);stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.timer .bg{stroke:var(--ink3)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font:700 18px var(--f-display)}
.screen-shake{animation:shake .45s}
canvas.confetti{position:absolute;inset:0;z-index:95;pointer-events:none;width:100%;height:100%}
.rank{font:700 64px/.95 var(--f-display);text-transform:uppercase;transform:skewX(-6deg);color:var(--acid)}
.glos{display:grid;gap:8px;padding:0 20px}
.glos .g{padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--ink2)}
.glos .g b{font:700 16px var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.glos .g small{color:var(--muted);font:500 10.5px var(--f-mono);margin-left:8px}
.glos .g p{margin:4px 0 0;font-size:13.5px;color:var(--soft)}

/* ---------- SQUAD ---------- */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px}
.slot{position:relative;aspect-ratio:3/4.3;border:1.5px dashed var(--line2);border-radius:14px;display:grid;place-items:center;overflow:hidden;background:var(--ink2);text-align:center;transition:transform .2s,border-color .2s}
.slot.fill{border-style:solid;border-color:var(--line2)}
.slot .plus{display:grid;justify-items:center;gap:6px;color:var(--muted);font:600 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.slot .plus svg{width:26px;height:26px}
.slot .poster{position:absolute;inset:0}
.slot .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(12,13,16,.94))}
.slot .nm{position:absolute;left:8px;right:8px;bottom:8px;font:700 15px/1 var(--f-display);text-transform:uppercase;text-align:left}
.slot .x{position:absolute;top:4px;right:4px;width:30px;height:30px;display:grid;place-items:center;background:rgba(12,13,16,.65);border-radius:50%;z-index:3}
.slot .x svg{width:15px;height:15px}
.meter{height:12px;background:var(--ink3);clip-path:polygon(0 0,100% 0,calc(100% - 7px) 100%,0 100%);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0;width:0;background:repeating-linear-gradient(-45deg,var(--acid) 0 8px,var(--acid2) 8px 16px);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.check{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--ink2);font-size:14px}
.check .c{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);flex:none;transition:.4s}
.check.ok .c{background:var(--good);border-color:var(--good);color:#06240f}
.check .c svg{width:15px;height:15px;stroke-width:3}

/* ---------- PROFILE ---------- */
.prof-head{display:flex;gap:16px;align-items:center;padding:4px 20px 18px}
.avatar{width:84px;height:84px;border-radius:20px;background:var(--acid);display:grid;place-items:center;overflow:hidden;flex:none}
.xp{display:grid;gap:7px;flex:1;min-width:0}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px}
.badge{display:grid;justify-items:center;gap:6px;padding:14px 6px;border:1px solid var(--line);border-radius:14px;background:var(--ink2);text-align:center;font:600 11px/1.2 var(--f-body);color:var(--soft)}
.badge .bi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--acid);color:var(--acidink)}
.badge .bi svg{width:22px;height:22px}
.badge.lock{opacity:.5}
.badge.lock .bi{background:var(--ink3);color:var(--muted)}
.setrow{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.setrow .tx{flex:1;min-width:0}
.setrow b{display:block;font-weight:600;font-size:15px}
.setrow small{color:var(--muted);font-size:12.5px}
.sw{position:relative;width:52px;height:30px;border-radius:15px;background:var(--ink3);border:1px solid var(--line2);flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--paper);transition:transform .3s cubic-bezier(.3,1.5,.4,1)}
.sw.on{background:var(--acid);border-color:var(--acid)}
.sw.on::after{transform:translateX(22px);background:var(--acidink)}

/* ---------- ONBOARD ---------- */
.onb{display:flex;flex-direction:column;min-height:100%;padding:70px 24px 30px;gap:22px}
.onb .steps{display:flex;gap:6px}
.onb .steps i{flex:1;height:4px;border-radius:2px;background:var(--ink3);overflow:hidden;position:relative}
.onb .steps i::after{content:"";position:absolute;inset:0;background:var(--acid);transform:scaleX(0);transform-origin:left;transition:transform .5s}
.onb .steps i.on::after{transform:none}
.onb input.big{width:100%;height:64px;padding:0 18px;background:var(--ink2);border:2px solid var(--line2);border-radius:16px;font:700 26px var(--f-display);text-transform:uppercase;letter-spacing:.04em;outline:0;transition:border-color .2s}
.onb input.big:focus{border-color:var(--acid)}
.lvl{display:grid;grid-template-columns:54px 1fr 24px;gap:14px;align-items:center;width:100%;padding:16px;text-align:left;border:2px solid var(--line2);border-radius:16px;background:var(--ink2);transition:.25s}
.lvl.on{border-color:var(--acid);background:rgba(223,255,46,.08);transform:scale(1.01)}
.lvl b{display:block;font:700 19px var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.lvl small{color:var(--muted);font-size:13px;line-height:1.35;display:block}
.lvl .tk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;transition:.25s}
.lvl.on .tk{background:var(--acid);border-color:var(--acid);color:var(--acidink)}
.lvl .tk svg{width:14px;height:14px;stroke-width:3;opacity:0;transition:.2s}
.lvl.on .tk svg{opacity:1}
.lvl .em{width:54px;height:54px;border-radius:14px;background:var(--ink3);display:grid;place-items:center;color:var(--acid)}
.lvl .em svg{width:28px;height:28px}
.bubble{position:relative;padding:14px 16px;background:var(--paper);color:var(--ink);border-radius:16px 16px 16px 4px;font:600 15px/1.35 var(--f-body)}

/* ---------- search overlay ---------- */
.ovl{position:absolute;inset:0;z-index:75;background:var(--ink);transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column;padding-top:30px}
.ovl.show{transform:none}
.ovl .res{flex:1;overflow:auto;padding:6px 20px 30px;display:grid;gap:8px;align-content:start}
.res .r{display:flex;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--ink2);text-align:left;transition:transform .15s}
.res .r:active{transform:scale(.97)}
.res .r .k{font:600 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--acid);width:52px;flex:none}
.res .r b{font-weight:600;font-size:15px}
.res .r small{display:block;color:var(--muted);font-size:12px}
mark{background:var(--acid);color:var(--acidink);padding:0 2px;border-radius:2px}

/* wireframe skin: grayscale, no art */
.wire{--ink:#FFFFFF;--ink2:#F2F2F2;--ink3:#E6E6E6;--line:#BDBDBD;--line2:#9E9E9E;--paper:#111;--soft:#2B2B2B;--muted:#555;--dim:#777;--acid:#BDBDBD;--acid2:#9E9E9E;--acidink:#111;--hot:#777;--cyan:#999;--violet:#888;--pink:#888;--amber:#999;--good:#777;--bad:#555}
.wire .crt,.wire .statusbar{display:none}
.wire .device{box-shadow:none}
.wire .poster{background:#DADADA!important;position:absolute}
.wire .poster svg{display:none}
.wire .poster::before,.wire .poster::after{content:"";position:absolute;left:50%;top:50%;width:140%;height:2px;background:#A5A5A5;transform:translate(-50%,-50%) rotate(35deg)}
.wire .poster::after{transform:translate(-50%,-50%) rotate(-35deg)}
.wire .shade{background:linear-gradient(180deg,transparent 50%,rgba(255,255,255,.9))!important}
.wire .h-disp,.wire .btn,.wire .acard .nm{font-family:Arial,Helvetica,sans-serif;font-weight:700;transform:none}
.wire .btn,.wire .tag{clip-path:none;border:1.5px solid #111}
.wire .hazard{background:#BDBDBD}
.wire .tabbar{background:#fff;backdrop-filter:none}
.wire .tabbar .pill{background:#111}
.wire .tabbar .t.on{color:#fff}
.wire .season,.wire .tile .big,.wire .lesson-card .big-n{clip-path:none}

/* ---- extras / fixes ---- */
html,body{height:auto;min-height:100%}
body{overflow:auto;background:var(--ink)}
.stage{height:100vh;min-height:720px}
.poster{overflow:hidden}
.poster svg{display:block;width:100%;height:100%}
.hero-card .poster,.acard .poster,.slot .poster,.dhero .poster{position:absolute}
.hero-card .bdg{position:absolute;top:14px;left:14px;z-index:2}
.hero-card{padding:0;border:0;color:inherit;font:inherit}
.search input{font-size:16px}
.search button{display:grid;place-items:center;width:28px;height:28px;color:var(--muted)}
.search button svg{width:18px;height:18px}
.acard .rar{position:absolute;top:10px;left:10px;z-index:3}
.acard .fav{cursor:pointer}
.view[data-screen=agent],.view[data-screen=article]{padding-top:0}
.dhero .tools{top:44px}
.art-hero{padding-top:84px}
.path .mod{position:relative;background:var(--ink3)}
.node-lbl{pointer-events:none;text-shadow:0 1px 6px #000}
.slot .nm{pointer-events:none}
.slot{cursor:pointer;color:inherit}
.sw{padding:0}
.tabbar .t span{line-height:1}
.mate{width:100%;color:inherit}
.mate>svg.ico{width:20px;height:20px;color:var(--muted)}
.mate .pic svg.ico{width:100%;height:100%}
.btn:disabled{cursor:default}
.eyebrow{white-space:nowrap}
.lesson-card{display:flex;flex-direction:column}
.prose p:last-child{margin-bottom:0}
.beat .card{transition:border-color .3s,background .3s}
.beat.open .card{border-color:var(--acid);background:var(--ink3)}

<script>
(function(){
const DATA={"meta":{"game":"Zenless Zone Zero (ZZZ), HoYoverse","as_of":"2026-10-28","game_version":"3.3 «Journey to the Sky» (фаза 1: 21.10.2026; фаза 2: 11.11.2026; версія 3.4 запланована на 02.12.2026)","language_note":"Український переклад термінів робочий, неофіційний: офіційної україномовної термінології не перевірялося. Офіційні англійські назви подано в дужках."},"world":[{"id":"new_eridu","title_ua":"Нью-Ерідо","title_en":"New Eridu","summary_ua":"Місто-держава, у якому відбувається гра, і, за описами джерел, останній великий осередок цивілізації у світі, що пережив Катастрофу Порожнин.","detail_ua":"Нью-Ерідо відбудували на місці старої столиці Ерідо після катастрофи. Місто поділене на райони (city quarters), а владу тут має міська адміністрація на чолі з мером, якій підпорядковані служба громадської безпеки та Асоціація дослідження Порожнин. Енергія Ефіру живить місцеву індустрію та побут, тому місто існує поруч із Порожнинами, а не всупереч їм. Візуально воно навмисно ретро-аналогове: кнопкові телефони, відеокасети, ЕПТ-телевізори та аркади. Автори прагнули зробити його живим і барвистим, а не похмурим.","uncertain":false},{"id":"hollow_disaster","title_ua":"Катастрофа Порожнин і Старе Ерідо","title_en":"Hollow Disaster / Old Eridu","summary_ua":"Подія, після якої стара столиця Ерідо впала, а вцілілі люди збудували Нью-Ерідо.","detail_ua":"За Вікіпедією, ця катастрофа сталася приблизно за одинадцять років до подій гри й торкнулася майже всіх нинішніх мешканців міста. У сюжеті падіння Старого Ерідо пов'язують із дослідницею Академії Геліос Керол Арна, яку звинувачують у трагедії; брат і сестра Фаетон (Phaethon) виявляються її прийомними дітьми й хочуть очистити її ім'я. Окремі деталі катастрофи (її точні причини й масштаб) розкриваються поступово в сюжетних сезонах, тому тут не подано повних спойлерів. Точний часовий проміжок «11 років» варто вважати орієнтовним.","uncertain":true},{"id":"hollows","title_ua":"Порожнини","title_en":"Hollows","summary_ua":"Надприродні зони-катастрофи з викривленим простором, які вкривають значну частину планети.","detail_ua":"Порожнини описують як розломи або альтернативні виміри з нестабільними просторовими спотвореннями, монстрами, цінними ресурсами Ефіру та стародавніми руїнами. Звичайним людям радять туди не заходити, а тим паче не сам. Найвідоміші зони у грі мають власні назви, наприклад Лемніанська Порожнина біля півострова Вайфей (Lemnian Hollow) та Порожнина Скамалл (Scamall Hollow) біля Роскаеліфера. «Hollow Zero» одночасно означає і згадуваний у лорі катастрофічний інцидент, і постійний роґалайк-режим у грі.","uncertain":false},{"id":"ether_ethereals","title_ua":"Ефір та Ефіріали","title_en":"Ether & Ethereals","summary_ua":"Ефір (Ether) спотворює матерію в Порожнинах, а чудовиська, що там виникають, називаються Ефіріалами (Ethereals).","detail_ua":"Поза Порожнинами Ефір слугує джерелом енергії для сучасного суспільства, а всередині спотворює речовину. Розумні істоти, які надто довго залишаються в Порожнині, можуть самі перетворитися на Ефіріалів. З часом навколо Порожнин виросла ціла економіка: люди видобувають там ресурси й сперечаються за контроль над ними. Особливий різновид, Жертви (Sacrifices), — це Ефіріали, штучно створені людським втручанням; розслідування їх є одним із центральних сюжетних завдань першого сезону.","uncertain":false},{"id":"proxies","title_ua":"Проксі","title_en":"Proxies","summary_ua":"Провідники й охоронці, які допомагають людям проходити Порожнинами; головний герой гри теж Проксі.","detail_ua":"Проксі беруть замовлення на супровід клієнтів у Порожнинах, часто дистанційно, спостерігаючи за ситуацією через спеціальні системи. Гравець обирає одного з двох близнюків-Проксі, Белл (Belle) або Вайза (Wise), а другий стає помічником; разом вони діють під псевдонімом Фаетон. У грі також є репутаційні ранги Проксі, найвищий з яких називається Легендарний Проксі (Legendary Proxy). Самі Проксі безпосередньо в бій майже не вступають: воюють Агенти, яких вони підтримують.","uncertain":false},{"id":"inter_knot","title_ua":"Інтер-Нот","title_en":"Inter-Knot","summary_ua":"Мережа Проксі та внутрішньоігрове меню, де є новини, замовлення й розклад.","detail_ua":"У світі гри Інтер-Нот — мережа, у якій Проксі обмінюються інформацією та шукають замовлення. У грі це меню Proxy Network з сповіщеннями-дописами, розкладом активних завдань і журналом сюжету. Також Інтер-Нот означає рівень акаунта (Inter-Knot Level), максимум якого зараз становить 60 за даними Icy Veins; він відкриває вищі межі рівнів Агентів, W-двигунів і Bangboo та нові режими. Окремі спільноти в мережі, як-от форум Spook Shack, працюють як неформальні фракції.","uncertain":false},{"id":"bangboo","title_ua":"Bangboo (Бенгбу)","title_en":"Bangboo","summary_ua":"Кролико-подібні роботи, що допомагають у побуті й у бою як четвертий член загону.","detail_ua":"У бою команда складається з трьох Агентів і одного Bangboo, який автоматично використовує активне вміння, дає пасивні ефекти та може долучатися до ланцюгових атак. За довідкою, Bangboo виготовляє й сертифікує корпорація Marcel Group. Вони бувають рангів A та S, їх отримують на окремому банері, де використовують Бупони (Boopons), які не купуються за реальні гроші. Особливий Bangboo Еос (Eous, №01) є «очима й вухами» Фаетона в Порожнинах.","uncertain":false},{"id":"phaethon_fairy","title_ua":"Фаетон і Фея","title_en":"Phaethon & Fairy","summary_ua":"Фаетон (Phaethon) — легендарний псевдонім двох Проксі, а Фея (Fairy) — ШІ-помічник, що з'явився в їхній системі.","detail_ua":"Белл і Вайз приховували, що за відомим Проксі Фаетоном стоять саме вони. На початку сюжету їхню систему Hollow Deep Dive (HDD) зламали, і до неї потрапила Фея, потужний ШІ з сарказмом та манерою нагадувати про дорогі послуги; відтоді вона значно розширює можливості Проксі. Бойовий аватар Фаетона, Піроїс (Pyrois), стає доступним усім гравцям на початку Сезону 3. Імена Фаетон і Геліос натякають на спільні грецькі мотиви й на Академію Геліос.","uncertain":false},{"id":"random_play","title_ua":"Відеопрокат «Random Play»","title_en":"Random Play","summary_ua":"Магазин відеокасет, що слугує прикриттям і базою Фаетона.","detail_ua":"Белл і Вайз офіційно керують крамницею оренди відео, а таємно приймають замовлення Проксі. Тут гравець повертається між місіями, спілкується з Агентами та розвиває рівень магазину. Крамниця розташована на Шостій вулиці (Sixth Street), у стартовому районі гри. Саме відеопрокат пов'язує ретро-естетику міста з головною сюжетною лінією.","uncertain":false},{"id":"hia","title_ua":"Асоціація дослідження Порожнин (HIA)","title_en":"Hollow Investigative Association (HIA)","summary_ua":"Організація, що пропонує небезпечні завдання проти Порожнин; її клуб розташований у Луміна-сквер.","detail_ua":"У джерелах назву подають по-різному: Hollow Investigative Association (Sportskeeda, Вікіпедія) або Hollow Investigation Association (запит користувача); найточніша форма потребує перевірки в самій грі. HIA підпорядковується міській адміністрації та пропонує клубні активності: Combat Simulation, Expert Challenge, Shiyu Defense, Notorious Hunt. Нагородою слугують Інвестиційні заслуги (Investigation Merits), які обмінюють у магазині поблизу Scott Outpost. У версії 3.3 в клубі HIA працює VR-гра «Spooky Funhouse Tales».","uncertain":true},{"id":"districts","title_ua":"Райони Нью-Ерідо","title_en":"New Eridu districts (Janus Quarter, Sixth Street, Lumina Square)","summary_ua":"Основні відвідувані локації міста: Шоста вулиця, Луміна-сквер, Порт Елпіс, вулиця Брант та Балетний шлях.","detail_ua":"Район Янус (Janus Quarter) — головний комерційний квартал, де розташовані Шоста вулиця (Sixth Street, стартова зона з Random Play), Луміна-сквер (Lumina Square, щільна забудова з магазинами та клубом HIA) та Порт Елпіс (Port Elpis, набережна, додана у версії 1.4). Вулиця Брант (Brant Street) — дім Belobog Heavy Industries, а Балетний шлях (Ballet Twins Road) — зона Victoria Housekeeping; обидві відкриваються в сюжеті. Квартал Трону (Throne Quarter) містить штаб H.A.N.D. та курортну зону Fantasy Resort. Scott Outpost — військовий табір, звідки запускають Hollow Zero, Shiyu Defense та Deadly Assault.","uncertain":false},{"id":"outer_ring","title_ua":"Зовнішнє Кільце","title_en":"Outer Ring (Blazewood)","summary_ua":"Пустельні околиці Нью-Ерідо, якими керують байкерські банди.","detail_ua":"Зовнішнє Кільце розташоване за межами основного міста, а найвідоміше поселення тут — Блейзвуд (Blazewood). Територію контролюють Сини Каледона (Sons of Calydon), байкерська банда, що бере участь у кількох сюжетних лініях. Сюди ж, за сюжетом першого сезону, втікає один із головних антагоністів Перлман (Pearlman). У фіналі Сезону 2 за таємничою постаттю Ramiel полюють кілька угруповань саме тут.","uncertain":false},{"id":"waifei","title_ua":"Півострів Вайфей","title_en":"Waifei Peninsula","summary_ua":"Віддалений регіон на заході, головна арена Сезону 2.","detail_ua":"Головне місто регіону — Файлюм-Гайтс (Failume Heights) зі стилем східних містечок; поряд розташована Лемніанська Порожнина, багата на цінну сировину. Тут розташований храм-школа Yunkui Summit на чолі з Іксюань (Yixuan), а гравець може розвивати власний храм Суйбянь (Suibian Temple). Регіон відкрито у версії 2.0 (6 червня 2025); Сейлюм-Бей (Sailume Bay) додали у 2.1. За даними Fandom, регіон вважають частиною кварталу Трону, хоча його відокремлює океан.","uncertain":true},{"id":"roscaelifer","title_ua":"Роскаеліфер","title_en":"Roscaelifer","summary_ua":"Літаюче острівне місто у засекреченому повітряному просторі, головне місце дії Сезону 3.","detail_ua":"Роскаеліфер описують як «Celestial Nexus» (небесний вузол) далеко на заході, куди ведуть лише спеціальні авіарейси. Він відкрився гравцям у версії 3.0 (17 червня 2026). У ньому є район Буваструм (Booastrum), де живуть Bangboo, та острівець Віріум (Vyrium) з майстернею Flint Workshop; у 3.3 додано аеропорт Quietude Isle. Департаментами міста керують троє директорів-«Санбрінґерів» (Sunbringers) — Елдреда, Ліндверн і Дракена; їх створив оригінальний Sunbringer.","uncertain":false}],"timeline":[{"order":1,"title_ua":"Пролог: Фаетон і Фея","summary_ua":"Систему HDD брата й сестри хакнули, у ній з'являється ШІ Фея; з допомогою Cunning Hares Фаетон вибирається з Порожнини та протистоїть корпорації Vision.","version_or_season":"Сезон 1, Розділ 1 / версія 1.0 (4 липня 2024)"},{"order":2,"title_ua":"Belobog Heavy Industries і послання Рейн","summary_ua":"Фаетон допомагає будівельній компанії Коледи упоратися зі збожеволілими механізмами й отримує зашифрований чіп, який розшифровує хакерка Рейн.","version_or_season":"Сезон 1, Розділ 2 (разом із інтерлюдією про CISRT)"},{"order":3,"title_ua":"Інтерлюдія: поліція та вибори","summary_ua":"Чжу Юань і Цін І з Criminal Investigation Special Response Team розслідують інцидент з ЕМІ-пристроєм, а тиск з боку службовця змушує приховувати знахідку перед виборами.","version_or_season":"Сезон 1, Розділ 2 (інтерлюдія)"},{"order":4,"title_ua":"Victoria Housekeeping і Балетні близнюки","summary_ua":"Рейн зникає зі зв'язку, і команда шукає її в Балетних близнюках; після порятунку Перлман вилітає на дирижаблі у Зовнішнє Кільце.","version_or_season":"Сезон 1, Розділ 3"},{"order":5,"title_ua":"Змова Бринґера та екзальтистів","summary_ua":"Фаетон разом із Секцією 6 та Синами Каледона розкриває змову інспектора Джастіна Бринґера й екзальтистки Сари, що прагнуть «очистити» людство через катастрофу Порожнин.","version_or_season":"Сезон 1, версії 1.x (точний розподіл за версіями не підтверджено)"},{"order":6,"title_ua":"Розділ Порт Елпіс і Секція 6","summary_ua":"Проксі приєднуються до Секції 6, де розкриваються подробиці минулого Вайза й Белл, а сюжет досягає кульмінації у Порт Елпісі.","version_or_season":"Сезон 1 / версія 1.4 (18 грудня 2024)"},{"order":7,"title_ua":"Криза Жертв і Mockingbird","summary_ua":"На прохання мера Фаетон розслідує створення Жертв, зустрічається з групою фантомних злодіїв Mockingbird; у 1.6 відбувається аукціон артефакту, а у 1.7 розкривається правда про Жертв і змову екзальтистів.","version_or_season":"Сезон 1, фінал / версії 1.6 (12 березня 2025) – 1.7 (23 квітня 2025)"},{"order":8,"title_ua":"Початок Сезону 2: Півострів Вайфей","summary_ua":"Мер надсилає Проксі на півострів Вайфей досліджувати Лемніанську Порожнину; у пригоді стає Іксюань з Yunkui Summit.","version_or_season":"Сезон 2 / версія 2.0 «Where Clouds Embrace the Dawn» (6 червня 2025)"},{"order":9,"title_ua":"Змови на Вайфеї","summary_ua":"Фаетон разом з Yunkui Summit, Spook Shack та Obol Squad зупиняє кілька змов екзальтистів, а Є Шунгуан після перемоги над Сарою отримує титул Мисливця на Порожнечу.","version_or_season":"Сезон 2, версії 2.x (точні версії не перевірено)"},{"order":10,"title_ua":"Ремієль Дан і фінал Сезону 2","summary_ua":"Проксі знайомляться з Мисливицею на Порожнечу Ремієль Дан і зброєю Thaumiel; у фіналі за таємничою Ramiel полюють кілька угруповань, а Promeia, Starlight-Billy і Cissia утворюють тимчасовий союз.","version_or_season":"Сезон 2, фінальний розділ / версія 2.8 «New: Eridan Sunset» (6 травня 2026)"},{"order":11,"title_ua":"Початок Сезону 3: Роскаеліфер","summary_ua":"Мер запрошує Проксі в літаюче місто, де лікують надлишок Ефіру в їхніх тілах; вони вчаться там як переведені студенти й дізнаються про силу Піроїс.","version_or_season":"Сезон 3 / версія 3.0 «A Sleepwalker's Confession» (17 червня 2026)"},{"order":12,"title_ua":"Довге прощання й таємниці Роскаеліфера","summary_ua":"На острів прибувають представники великих фракцій, Проксі зустрічають Труві, спадкоємицю High Ambitions Corp, а Ремієль повертається; наступна версія розслідує проникнення TOPS і партію Porcelloy.","version_or_season":"Сезон 3 / версії 3.1 «The Long Goodbye» (29 липня 2026) та 3.2 «Their Secret Histories» (9 вересня 2026)"},{"order":13,"title_ua":"Блокада острова","summary_ua":"Роскаеліфер закритий, давні суперники змушені до тимчасового союзу; Проксі діють під прикриттям і вперше керують мехами, створеними силою Ліндверн.","version_or_season":"Сезон 3 / версія 3.3 «Journey to the Sky» (21 жовтня 2026)"}],"factions":[{"name_en":"Cunning Hares","name_ua":"Хитрі зайці","type":"агенція замовлень","one_line_ua":"Невелика агенція, що береться за завдання, від яких відмовляються великі компанії; раніше мала назву Gentle House.","notable_agents":["Anby Demara","Nicole Demara","Billy Kid","Nekomata (Nekomiya Mana)"]},{"name_en":"Victoria Housekeeping Co.","name_ua":"Вікторія Хаусікіпінг","type":"сервісна компанія","one_line_ua":"Прибиральна компанія у стилі вікторіанських слуг, персонал якої також діє як елітна бойова група.","notable_agents":["Ellen Joe","Von Lycaon","Corin Wickes","Alexandrina Sebastiane (Rina)"]},{"name_en":"Belobog Heavy Industries","name_ua":"Белобог Хеві Індастріс","type":"будівельна компанія","one_line_ua":"Будівельна фірма, що спеціалізується на роботах у Порожнинах; очолює її Коледа.","notable_agents":["Koleda Belobog","Ben Bigger","Anton Ivanov","Grace Howard"]},{"name_en":"Criminal Investigation Special Response Team (CISRT)","name_ua":"Спеціальна група кримінальних розслідувань","type":"поліція","one_line_ua":"Підрозділ служби громадської безпеки Нью-Ерідо, що відповідає за розслідування та затримання.","notable_agents":["Zhu Yuan","Qingyi","Jane Doe","Seth Lowell"]},{"name_en":"Metropolitan Order Division","name_ua":"Відділ міського порядку","type":"поліція","one_line_ua":"Підрозділ поліції для складних справ у структурі громадської безпеки.","notable_agents":["Cissia"]},{"name_en":"Hollow Special Operations Section 6","name_ua":"Секція 6 Спецоперацій у Порожнинах","type":"державний спецзагін","one_line_ua":"Передовий підрозділ H.A.N.D. з реагування на катастрофи Порожнин, до якого входять найсильніші бійці.","notable_agents":["Hoshimi Miyabi","Soukaku","Tsukishiro Yanagi","Asaba Harumasa"]},{"name_en":"Sons of Calydon","name_ua":"Сини Каледона","type":"байкерська банда","one_line_ua":"Банда, що контролює Зовнішнє Кільце за межами Нью-Ерідо.","notable_agents":["Caesar King","Burnice White","Lighter","Lucy (Luciana de Montefio)","Piper Wheel","Pulchra Fellini"]},{"name_en":"Obol Squad","name_ua":"Загін Обол","type":"військова частина","one_line_ua":"Підрозділ Обсидіанового відділу Сил оборони Нью-Ерідо, схожий на спецназ.","notable_agents":["Soldier 11","Trigger","Orphie Magnusson & Magus","Seed"]},{"name_en":"Defense Force Silver Squad","name_ua":"Срібний загін Сил оборони","type":"військова частина (історична)","one_line_ua":"Колишній підрозділ оборонних сил; згідно з джерелами, більше не існує, але пов'язаний з Енбі.","notable_agents":["Soldier 0 – Anby"],"uncertain":true},{"name_en":"Stars of Lyra","name_ua":"Зірки Ліри","type":"музична група","one_line_ua":"Угруповання найвідомішої співачки Нью-Ерідо.","notable_agents":["Astra Yao","Evelyn Chevalier"]},{"name_en":"Mockingbird","name_ua":"Пересмішник","type":"злодійський синдикат","one_line_ua":"Таємничий синдикат фантомних злодіїв Нью-Ерідо, який також відіграє важливу роль у сюжеті Жертв.","notable_agents":["Hugo Vlad","Vivian Banshee"]},{"name_en":"Yunkui Summit","name_ua":"Саміт Юнькуй","type":"храм бойових мистецтв","one_line_ua":"Головна фракція півострова Вайфей на чолі з Іксюань, відома майстерністю у бойових мистецтвах.","notable_agents":["Yixuan","Ju Fufu","Pan Yinhu","Ye Shunguang"]},{"name_en":"Spook Shack","name_ua":"Хатина привидів","type":"онлайн-форум","one_line_ua":"Форум Інтер-Нот про міські легенди та паранормальне, що працює як фракція.","notable_agents":["Ukinami Yuzuha","Alice Thymefield","Komano Manato","Lucia Elowen","Yidhari Murphy"]},{"name_en":"Angels of Delusion (A.O.D.)","name_ua":"Ангели ілюзій","type":"віртуальні айдоли","one_line_ua":"Тріо віртуальних айдолів; дебютували в клубі 404 Error Livehouse.","notable_agents":["Nangong Yu","Aria","Sunna"]},{"name_en":"Krampus Compliance Authority","name_ua":"Управління відповідності «Крампус»","type":"підрозділ корпоративного альянсу","one_line_ua":"Підрозділ альянсу TOPS, що стежить за дотриманням правил його учасниками.","notable_agents":["Zhao","Dialyn","Banyue","Promeia","Phoenix Reffaella"]},{"name_en":"Flint Workshop","name_ua":"Майстерня Флінт","type":"виробнича компанія","one_line_ua":"Виробник матеріалу Porcelloy у Роскаеліфері, який допомагає стабілізувати Ефір.","notable_agents":["Claret Flint","Roxy"]},{"name_en":"Airspace Patrol Department","name_ua":"Департамент повітряного патрулювання","type":"міська служба Роскаеліфера","one_line_ua":"Підрозділ, що стежить за небом Роскаеліфера й бореться з Ефіріалами Порожнини Скамалл.","notable_agents":["Sigrid de L'Azur"]},{"name_en":"External Strategy Department (ESD)","name_ua":"Департамент зовнішньої стратегії","type":"міська служба Роскаеліфера","one_line_ua":"Інженерно орієнтований департамент, пов'язаний із Bangboo та технологіями Роскаеліфера.","notable_agents":["Velina Airgid","Norma Hollowell"]},{"name_en":"Covenant of Dayat","name_ua":"Союз Даят","type":"сюжетна фракція","one_line_ua":"Сюжетна фракція з одним доступним для гри персонажем; перевірити назву в інших джерелах не вдалося.","notable_agents":["Remielle Dan"],"uncertain":true}],"mechanics":[{"id":"attributes","term_en":"Attributes (Physical, Fire, Ice, Electric, Ether, Auric Ink, Wind, Lumiflux)","term_ua":"Атрибути (стихії)","explain_ua":"Кожен Агент має один атрибут, який визначає тип його шкоди. На старті було п'ять основних: Фізичний, Вогонь, Лід, Електрика та Ефір; далі додано Auric Ink (Агент Іксюань у 2.0, аномалія Corruption), Вітер (Wind, Велина, 3.0) і Lumiflux (Ремієль Дан, 3.1). Атрибути не вступають у реакції між собою, а різні аномалії викликають Disorder.","tip_ua":"Підбирайте команду так, щоб двоє мали однаковий атрибут чи фракцію, бо це відкриває бонус Додаткової здатності."},{"id":"specialties","term_en":"Specialties: Attack, Stun, Anomaly, Support, Defense, Rupture, Armorer","term_ua":"Спеціалізації","explain_ua":"Спеціалізація визначає роль Агента: Attack завдає основної шкоди, Stun накопичує Daze, Anomaly накладає аномалії, Support підсилює союзників, Defense приймає удари. Rupture завдає шкоди Sheer, що ігнорує захист ворога, а Armorer, найновіша, балансує атаку й захист і з'явилась у версії 3.2 разом із Клерет (Claret).","tip_ua":"Перевіряйте спеціалізацію W-двигуна: його пасивка працює тільки з відповідним типом Агента."},{"id":"daze_stun","term_en":"Daze / Stun","term_ua":"Приголомшення / оглушення","explain_ua":"Під смугою здоров'я ворога є шкала Daze, яку заповнюють удари; сила впливу залежить від показника Impact Агента. Коли шкала повна, ворог оглушується, отримує більше шкоди й стає вразливим до ланцюгових атак.","tip_ua":"Беріть у команду Агента-оглушувача, щоб частіше входити у вікна стану Stun."},{"id":"anomaly","term_en":"Anomaly Buildup & Disorder","term_ua":"Накопичення аномалії та Disorder","explain_ua":"Шкода атрибутом заповнює шкалу накопичення, а коли вона повна, на ворога діє аномалія: Burn (вогонь), Shock (електрика), Freeze/Shatter (лід), Assault (фізична) або Corruption (Ефір/Auric Ink). Якщо до наявної аномалії додати іншу, спрацьовує Disorder з додатковою шкодою та Daze; на ворога у стані Windswept замість нього діє Vortex.","tip_ua":"Anomaly Mastery визначає швидкість накопичення, а Anomaly Proficiency — силу шкоди від аномалії."},{"id":"chain_attack","term_en":"Chain Attack","term_ua":"Ланцюгова атака","explain_ua":"Якщо вдарити важким ударом по оглушеному ворогу, з'являється подія швидкого часу, у якій можна змінити Агента й завдати ще удару. Максимальна кількість ланцюгів залежить від ворога: 1 для звичайного, 2 для еліти й 3 для боса.","tip_ua":"Натискайте на портрет Агента до закінчення таймера: кожна ланцюгова атака ще й повертає одне очко Assist."},{"id":"ultimate","term_en":"Ultimate (Decibel Rating)","term_ua":"Ультимейт (Рейтинг децибелів)","explain_ua":"Атаки, ланцюгові атаки й допомоги накопичують Децибели, а при досягненні 3000 стає доступною Ультимейт-здатність. За більшістю джерел (Mobalytics, GamesFuze) шкала спільна для всієї команди, хоч у Prydwen згадано окрему шкалу в кожного.","tip_ua":"Не тримайте повну шкалу надто довго: використовуйте Ультимейт у вікно оглушення."},{"id":"quick_assist","term_en":"Quick Assist (Reactive Assist)","term_ua":"Швидка допомога","explain_ua":"Коли Агента підкинуло чи відкинуло ударом, у нижньому куті з'являється підказка, і натискання кнопки заміни викликає союзника з важкою атакою. Це не коштує очок Assist.","tip_ua":"Після Швидкої допомоги одразу продовжуйте комбо, щоб не втрачати темп."},{"id":"perfect_assist","term_en":"Perfect Assist (Defensive / Evasive Assist, parry)","term_ua":"Ідеальна допомога (парирування)","explain_ua":"Якщо змінити Агента точно в момент золотого спалаху перед ударом, вхідний Агент або парирує атаку й завдає Daze (Defensive Assist), або ухиляється (Evasive Assist) і вмикає Vital View зі сповільненням часу. Кожна дія коштує одне очко Assist, а після неї можна зробити Assist Follow-Up.","tip_ua":"Чекайте золотого сигналу: червоні удари парирувати не можна."},{"id":"dodge_counter","term_en":"Dodge, Perfect Dodge & Dodge Counter","term_ua":"Ухилення та контратака після ухилення","explain_ua":"Ухилення в останній момент перед ударом дає Perfect Dodge із короткою невразливістю. Якщо одразу після нього натиснути атаку, виконується Dodge Counter — важка атака, яка збирає енергію й може запустити ланцюг.","tip_ua":"Тренуйте тайминг на слабких ворогах, перш ніж йти до босів."},{"id":"ex_special","term_en":"EX Special Attack","term_ua":"Посилена спеціальна атака","explain_ua":"Звичайна Special Attack доступна без перезарядки, але вона слабка. Коли в Агента накопичилась енергія, ту саму кнопку замінює EX Special, що завдає значно більшої шкоди й часто є ядром комплекту навичок.","tip_ua":"Ловіть момент, коли шкала енергії перетнула позначку, і не витрачайте звичайні спеціальні атаки марно."},{"id":"core_skill","term_en":"Core Skill (Core Passive)","term_ua":"Основна навичка","explain_ua":"Кожен Агент має Core Skill, унікальну пасивку, яка посилюється на певних рівнях. Вона покращує пасивні ефекти й допомогу, а Additional Ability додає бонуси, коли в команді є Агенти з тим самим атрибутом або фракцією.","tip_ua":"Для підняття Core Skill потрібні матеріали з Expert Challenge."},{"id":"drive_discs","term_en":"Drive Discs","term_ua":"Диски драйву","explain_ua":"Кожен Агент носить шість Drive Disc у слотах I–VI: слоти I–III мають фіксований головний стат (HP, ATK, DEF), а IV–VI допускають різні статистики. Комплекти дають бонус за 2 та 4 предмети; зазвичай ставлять 4+2.","tip_ua":"Спершу вибирайте комплект під роль Агента, а головні стати слотів IV–VI підбирайте окремо."},{"id":"w_engines","term_en":"W-Engines","term_ua":"W-двигуни","explain_ua":"W-двигун — це «зброя» Агента, що додає атаку, додатковий стат і пасивний ефект. Його пасивка працює лише з відповідною спеціалізацією, а ранги бувають S, A та B.","tip_ua":"A-ранговий двигун правильної спеціалізації часто кращий за S-ранговий, що не підходить."},{"id":"mindscape_cinema","term_en":"Mindscape Cinema","term_ua":"Кінотеатр свідомості","explain_ua":"Це аналог сузір'їв чи ейдолонів: шість рівнів M1–M6, кожен відкривається дублікатом Агента. Рівні посилюють персонажа й мають анімації, які можна вимикати.","tip_ua":"Не гонитесь за дублями, поки основні статистики не доведені до розумного рівня."},{"id":"bangboo_mech","term_en":"Bangboo (battle partner)","term_ua":"Bangboo як напарник","explain_ua":"Четвертий слот команди займає Bangboo із трьома навичками: активна, додаткова здатність і ланцюгова атака. Він підсилює накопичення Daze й аномалій, але сам не може викликати оглушення чи аномалію.","tip_ua":"Використовуйте Бупони на окремому банері Bangboo, а не лише на Агентів."},{"id":"game_modes","term_en":"Hollow Zero, Shiyu Defense, Deadly Assault, Notorious Hunt","term_ua":"Режими: Hollow Zero, Shiyu Defense, Deadly Assault, Notorious Hunt","explain_ua":"Hollow Zero — роґалайк-режим із випадково згенерованими зонами; Shiyu Defense — серія таймерних боїв з нагородами за час; Deadly Assault — битва з босом на очки шкоди трьома командами; Notorious Hunt — щотижневий бос із матеріалами для W-двигунів. Старий режим TV Mode (Array Mode), заснований на плитках 2D, після негативних відгуків фактично прибрали.","tip_ua":"Для Shiyu Defense та Deadly Assault готуйте окремі команди з різними атрибутами."}],"glossary":[{"term_en":"Ether","term_ua":"Ефір","def_ua":"Енергія, що живить сучасне суспільство Нью-Ерідо, але спотворює матерію всередині Порожнин."},{"term_en":"Ethereal","term_ua":"Ефіріал","def_ua":"Чудовисько, що виникає в Порожнині; людина, яка надовго залишилась там, теж може ним стати."},{"term_en":"Hollow","term_ua":"Порожнина","def_ua":"Надприродна зона-катастрофа зі спотвореним простором, ресурсами й руїнами."},{"term_en":"Sacrifice","term_ua":"Жертва","def_ua":"Ефіріал, створений штучно за людської участі, розслідування якого рухає сюжет Сезону 1."},{"term_en":"Proxy","term_ua":"Проксі","def_ua":"Провідник, що супроводжує клієнтів у Порожнинах."},{"term_en":"Inter-Knot","term_ua":"Інтер-Нот","def_ua":"Мережа Проксі та рівень акаунта гравця."},{"term_en":"Phaethon","term_ua":"Фаетон","def_ua":"Легендарний псевдонім Белл і Вайза як Проксі."},{"term_en":"Random Play","term_ua":"Random Play","def_ua":"Відеопрокат, де живуть брат і сестра та приймають замовлення."},{"term_en":"Fairy","term_ua":"Фея","def_ua":"Потужний ШІ, що допомагає Проксі та радить склад команди."},{"term_en":"Eous","term_ua":"Еос","def_ua":"Bangboo №01, який служить «очима» Фаетона в Порожнинах."},{"term_en":"Pyrois","term_ua":"Піроїс","def_ua":"Бойовий аватар Фаетона, доступний усім гравцям з початку Сезону 3."},{"term_en":"Hollow Deep Dive (HDD)","term_ua":"Hollow Deep Dive (HDD)","def_ua":"Система дистанційного супроводу Порожнин, через яку Проксі спілкуються з Агентами."},{"term_en":"Bangboo","term_ua":"Bangboo","def_ua":"Кролико-подібні роботи, що допомагають у бою як четвертий член загону."},{"term_en":"Marcel Group","term_ua":"Marcel Group","def_ua":"Корпорація, що виготовляє й сертифікує Bangboo."},{"term_en":"TOPS","term_ua":"TOPS","def_ua":"Альянс найбільших бізнесів Нью-Ерідо."},{"term_en":"Krampus Compliance Authority","term_ua":"Управління «Крампус»","def_ua":"Підрозділ TOPS, який перевіряє дотримання правил учасниками альянсу."},{"term_en":"Void Hunter","term_ua":"Мисливець на Порожнечу","def_ua":"Титул найсильніших Агентів Нью-Ерідо, що здатні знищувати Ефіріалів."},{"term_en":"Exaltists","term_ua":"Екзальтисти","def_ua":"Релігійний культ, відомий також як The Order, головний ворог перших сезонів."},{"term_en":"H.A.N.D.","term_ua":"H.A.N.D.","def_ua":"Елітна організація з реагування на катастрофи Порожнин, до якої належить Секція 6."},{"term_en":"Sunbringer","term_ua":"Санбрінґер","def_ua":"Титул керівної постаті Роскаеліфера, три її «копії» очолюють департаменти."},{"term_en":"Porcelloy","term_ua":"Порцелой","def_ua":"Матеріал, який виробляє Flint Workshop і який допомагає стабілізувати Ефір."},{"term_en":"Daze","term_ua":"Daze (приголомшення)","def_ua":"Шкала під здоров'ям ворога, що при заповненні призводить до оглушення."},{"term_en":"Impact","term_ua":"Імпакт","def_ua":"Показник Агента, що визначає, скільки Daze він накладає."},{"term_en":"Anomaly Buildup","term_ua":"Накопичення аномалії","def_ua":"Прихована шкала, яка при заповненні накладає на ворога аномалію відповідного атрибута."},{"term_en":"Disorder","term_ua":"Disorder","def_ua":"Реакція, що спрацьовує, коли на ворога з однією аномалією накладають іншу."},{"term_en":"Windswept / Vortex","term_ua":"Windswept / Vortex","def_ua":"Стан від атрибута Вітер і вибух із шкодою по площі, що замінює Disorder."},{"term_en":"Sheer damage","term_ua":"Шкода Sheer","def_ua":"Тип шкоди Агентів Rupture, що ігнорує захист ворога."},{"term_en":"Assist Point","term_ua":"Очко Assist","def_ua":"Ресурс для Ідеальної допомоги; на старті бою їх шість."},{"term_en":"Decibel Rating","term_ua":"Рейтинг децибелів","def_ua":"Шкала, що при 3000 відкриває Ультимейт."},{"term_en":"Battery Charge","term_ua":"Battery Charge","def_ua":"Енергетична валюта для запуску ресурсних етапів і боїв з босами."},{"term_en":"Polychrome","term_ua":"Поліхром","def_ua":"Преміальна валюта, яку дають за досягнення, режими й події."},{"term_en":"Boopon","term_ua":"Бупон","def_ua":"Валюта для банера Bangboo, яку неможливо купити за реальні гроші."},{"term_en":"Signal Search","term_ua":"Пошук сигналу","def_ua":"Гача-система, у якій здобувають Агентів, W-двигуни й Bangboo."},{"term_en":"Dennies","term_ua":"Деніз","def_ua":"Основна ігрова валюта для прокачування навичок."}],"quiz":[{"q_ua":"Як називається місто, у якому відбувається гра Zenless Zone Zero?","options_ua":["Нью-Ерідо","Нова Атлантида","Геліополіс","Роскаеліфер"],"answer_index":0,"explain_ua":"Нью-Ерідо (New Eridu) — місто-держава, збудоване після падіння Старого Ерідо."},{"q_ua":"Під яким псевдонімом діють брат і сестра Белл і Вайз?","options_ua":["Піроїс","Фаетон","Мокінгберд","Еос"],"answer_index":1,"explain_ua":"Белл і Вайз працюють під ім'ям Фаетон (Phaethon); Піроїс — їхній бойовий аватар."},{"q_ua":"Який магазин є прикриттям і базою героїв?","options_ua":["Random Play","Spook Shack","Flint Workshop","Elfy's Music Store"],"answer_index":0,"explain_ua":"Random Play — відеопрокат, яким керують Белл і Вайз."},{"q_ua":"Як називають чудовиськ, що виникають у Порожнинах?","options_ua":["Санбрінґери","Bangboo","Ефіріали","Мисливці"],"answer_index":2,"explain_ua":"Ефіріали (Ethereals) виникають у Порожнинах внаслідок спотворення Ефіром."},{"q_ua":"Яка робота Проксі?","options_ua":["Будувати міста","Супроводжувати людей у Порожнинах","Виготовляти Bangboo","Керувати поліцією"],"answer_index":1,"explain_ua":"Проксі — провідники й охоронці клієнтів у Порожнинах."},{"q_ua":"Скільки Агентів і скільки Bangboo у бойовій команді?","options_ua":["Один Агент і два Bangboo","Два Агенти і один Bangboo","Три Агенти і один Bangboo","Чотири Агенти"],"answer_index":2,"explain_ua":"Загін має трьох Агентів і одного Bangboo."},{"q_ua":"Коли гра вийшла на ПК, iOS, Android і PS5?","options_ua":["4 липня 2024","6 червня 2025","17 червня 2026","1 січня 2024"],"answer_index":0,"explain_ua":"Реліз відбувся 4 липня 2024; Xbox отримала гру 6 червня 2025, Steam — 17 червня 2026."},{"q_ua":"Скільки Drive Disc може носити один Агент?","options_ua":["Чотири","Шість","Вісім","Дванадцять"],"answer_index":1,"explain_ua":"У слотах I–VI розміщують шість дисків; комплекти дають бонуси за 2 та 4 предмети."},{"q_ua":"Скільки Децибелів потрібно для Ультимейта?","options_ua":["1000","2000","3000","5000"],"answer_index":2,"explain_ua":"За джерелами, Ультимейт стає доступним при 3000 Децибелів."},{"q_ua":"Що відбувається, коли шкала Daze ворога повністю заповнюється?","options_ua":["Ворог зникає","Ворог оглушується і отримує більше шкоди","Агент втрачає енергію","Бій закінчується"],"answer_index":1,"explain_ua":"Заповнена шкала Daze призводить до оглушення, збільшеної шкоди й доступу до ланцюгових атак."},{"q_ua":"Яка спеціалізація завдає шкоди Sheer, що ігнорує захист?","options_ua":["Support","Defense","Rupture","Stun"],"answer_index":2,"explain_ua":"Rupture — спеціалізація, чия шкода Sheer ігнорує захист ворога; приклад — Іксюань."},{"q_ua":"Хто став першим Агентом з атрибутом Вітер?","options_ua":["Велина","Роксі","Піроїс","Ґрейс"],"answer_index":0,"explain_ua":"Велина (Velina) — перший Агент з атрибутом Wind, що з'явився у версії 3.0."},{"q_ua":"Де відбувається Сезон 2 основного сюжету?","options_ua":["Півострів Вайфей","Роскаеліфер","Порт Елпіс","Балетні близнюки"],"answer_index":0,"explain_ua":"Сезон 2 розпочався у версії 2.0 на півострові Вайфей."},{"q_ua":"Який регіон став головним у Сезоні 3?","options_ua":["Зовнішнє Кільце","Літаючий острів Роскаеліфер","Підводне місто","Старе Ерідо"],"answer_index":1,"explain_ua":"Сезон 3 почався у версії 3.0 у небесному місті Роскаеліфер."},{"q_ua":"Скільки рівнів має Mindscape Cinema?","options_ua":["Три","Чотири","Шість","Десять"],"answer_index":2,"explain_ua":"Рівні M1–M6 відкриваються дублікатами Агента."},{"q_ua":"Яка фракція контролює Зовнішнє Кільце?","options_ua":["Сини Каледона","Victoria Housekeeping","Stars of Lyra","Krampus Compliance Authority"],"answer_index":0,"explain_ua":"Сини Каледона (Sons of Calydon) — байкерська банда, яка керує Зовнішнім Кільцем."},{"q_ua":"Хто очолює Yunkui Summit?","options_ua":["Іксюань","Ювенал","Корін","Софі"],"answer_index":0,"explain_ua":"Іксюань (Yixuan) — Верховна наставниця Yunkui Summit."},{"q_ua":"Що спричиняє Disorder?","options_ua":["Шкода від Bangboo","Накладання іншої аномалії на ворога, що вже має аномалію","Поява нового боса","Повне заповнення Децибелів"],"answer_index":1,"explain_ua":"Disorder спрацьовує, коли нова аномалія замінює наявну, завдаючи додаткову шкоду й Daze."},{"q_ua":"Скільки очок Assist на початку бою для Ідеальної допомоги?","options_ua":["Одне","Три","Шість","Дванадцять"],"answer_index":2,"explain_ua":"Бій починається з шістьма очками Assist, кожна Ідеальна допомога коштує одне."},{"q_ua":"Як називається версія 3.3?","options_ua":["The Long Goodbye","Journey to the Sky","Their Secret Histories","New: Eridan Sunset"],"answer_index":1,"explain_ua":"3.3 має назву «Journey to the Sky» (21 жовтня 2026); попередня 3.2 — «Their Secret Histories»."}],"sources":[{"title":"Zenless Zone Zero — Wikipedia","url":"https://en.wikipedia.org/wiki/Zenless_Zone_Zero"},{"title":"List of Zenless Zone Zero characters — Wikipedia","url":"https://en.wikipedia.org/wiki/List_of_Zenless_Zone_Zero_characters"},{"title":"ZZZ Faction Guide — HostedGG","url":"https://hostedgg.com/blog/zenless-zone-zero-faction-guide"},{"title":"Faction overview — Icy Veins","url":"https://www.icy-veins.com/zenless-zone-zero/faction-overview-guide"},{"title":"Factions — Mobalytics","url":"https://mobalytics.gg/blog/zenless-zone-zero/factions/"},{"title":"Zenless Zone Zero — Prydwen.gg","url":"https://www.prydwen.gg/zenless/"},{"title":"Zenless Zone Zero — Game8","url":"https://game8.co/games/Zenless-Zone-Zero"},{"title":"Zenless Zone Zero official site","url":"https://zenless.hoyoverse.com/en-us/"},{"title":"Agents attributes — Prydwen","url":"https://www.prydwen.gg/zenless/guides/agents-attributes"},{"title":"Combat system — Prydwen","url":"https://www.prydwen.gg/zenless/guides/combat-system"},{"title":"Game modes — Prydwen","url":"https://www.prydwen.gg/zenless/guides/game-modes"},{"title":"Attributes, Anomalies, Specialties — Icy Veins","url":"https://www.icy-veins.com/zenless-zone-zero/character-elements-attribute-anomalies-and-attack-types"},{"title":"Lumiflux Attribute — Icy Veins","url":"https://www.icy-veins.com/zenless-zone-zero/lumiflux-attribute-anomaly-effect-and-characters"},{"title":"Wind Attribute — Icy Veins","url":"https://www.icy-veins.com/zenless-zone-zero/wind-attribute-anomaly-effect-and-characters"},{"title":"Wind attribute — Pocket Tactics","url":"https://www.pockettactics.com/zenless-zone-zero/wind-attribute"},{"title":"Version 3.2 Armorer specialty — The Outer Haven","url":"https://www.theouterhaven.net/zenless-zone-zero-version-3-2-their-secret-histories-introduces-armorer-specialty/"},{"title":"Version 3.3 Journey to the Sky — The Outer Haven","url":"https://www.theouterhaven.net/zenless-zone-zero-update-version-3-3-journey-to-the-sky-releases-october-21st/"},{"title":"Story recap — High Ground Gaming","url":"https://www.highgroundgaming.com/zenless-zone-zero-story-explained-recap/"},{"title":"The Long Goodbye overview — GenshinBuilds","url":"https://genshin-builds.com/ru/zenless/blog/zenless-zone-zero-the-long-goodbye-chapter-overview-and-release-details"},{"title":"Story explained — Esports.gg","url":"https://esports.gg/news/zenless-zone-zero-zzz/zenless-zone-zero-story-explained"},{"title":"Locations — ZZZ Fandom Wiki","url":"https://zenless-zone-zero.fandom.com/wiki/Locations"},{"title":"Maps and Travel Guides — Game8","url":"https://game8.co/games/Zenless-Zone-Zero/archives/450815"},{"titl
